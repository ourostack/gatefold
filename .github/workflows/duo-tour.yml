name: Build 36 delight review

# Review branch only (review-delight-build36), never merged: it borrows the Duo tour's dispatchable workflow so the
# reviewers' drivers (GatefoldUITests/TasteB36UITests.swift, TasteB36.swift) run on hosted runners. One job per
# device, the iPad first, then the Duo. Each test runs on its own with the screen recorded
# (.github/scripts/review/run.sh). The boot, the quiet first boot and the hang guards are app.yml's (gatefold#198,
# #209, #126); the hinge is the Duo tour's DeviceHub helper.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ipad:
    name: iPad Pro 13-inch
    runs-on: xcode-27
    timeout-minutes: 345
    env:
      DEVICE: iPad Pro 13-inch
      SIM: gatefold-ipad
    steps:
      - run: echo "JOB_DEADLINE=$(( $(date +%s) + 345 * 60 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: ./.github/actions/select-xcode
      - name: Start the simulator booting
        run: python3 -I scripts/ci-simulator.py start "$SIM" "$DEVICE"
      - name: Sample the runner's load every 20 s
        run: |
          # shellcheck disable=SC2016
          nohup sh -c 'while :; do echo "== $(date -u +%T) $(sysctl -n vm.loadavg)"; sleep 20; done' >> "$RUNNER_TEMP/load.log" 2>&1 &
      - name: Install the Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Generate the project
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate
      - name: Build the app and its tests
        timeout-minutes: 40
        run: |
          set -o pipefail
          xcodebuild build-for-testing -project Gatefold.xcodeproj -scheme Gatefold \
            -destination 'generic/platform=iOS Simulator' ARCHS="$(uname -m)" \
            -derivedDataPath "$RUNNER_TEMP/dd" 2>&1 | tee "$RUNNER_TEMP/build.log" | tail -40
          echo "XCTESTRUN=$(ls "$RUNNER_TEMP"/dd/Build/Products/*.xctestrun | head -1)" >> "$GITHUB_ENV"
      - name: The simulator finished booting
        timeout-minutes: 30
        env:
          CI_SIMULATOR_BUDGET: "1740"
        run: python3 -I scripts/ci-simulator.py wait "$SIM" "$DEVICE" 1200
      - name: Keep the app's place and reader logs (never the book's words)
        run: |
          mkdir -p "$RUNNER_TEMP/out" "$RUNNER_TEMP/xcr"
          nohup sh -c 'xcrun simctl spawn "$0" log stream --style compact --predicate "subsystem == \"bot.ouro.gatefold\" AND category == \"reader\"" 2>/dev/null \
            | grep --line-buffered -v -E "text:|\] visible|\] anchor[: ]" >> "$1"' "$UDID" "$RUNNER_TEMP/out/reader.log" >/dev/null 2>&1 &
      - name: Reviewer tests, one at a time, recorded
        timeout-minutes: 300
        env:
          OUT: ${{ runner.temp }}/out
          DISPLAYS: default
        run: |
          r=.github/scripts/review/run.sh
          # Cold first: the build 19 blocker on a just-booted device.
          $r aris-coldrot TasteB36/testA_ColdRotation 1500
          $r spazz-portrait TasteB36UITests/testS_spazz 3600 TASTE_ROUNDS=2
          $r spazz-landscape TasteB36UITests/testS_spazz 2700 TASTE_LANDSCAPE=1 TASTE_ROUNDS=1
          $r aris-place-portrait TasteB36/testE_PlaceByHand 1500
          $r aris-place-noprobe TasteB36/testE_PlaceByHand 1500 R2_NOPROBE=1
          $r books-chain-landscape TasteB36UITests/testB_reopenChain 1800 TASTE_LANDSCAPE=1
          $r aris-reopen-landscape TasteB36/testB_ReopenOnWords 1800 R2_LANDSCAPE=1 R2_ROUNDS=8
          $r books-contents-landscape TasteB36UITests/testK_contentsJump 900 TASTE_LANDSCAPE=1
          $r books-catchup-landscape TasteB36UITests/testL_catchUp 600 TASTE_LANDSCAPE=1
          $r books-looks-portrait TasteB36UITests/testM_looks 900
          $r books-looks-landscape TasteB36UITests/testM_looks 900 TASTE_LANDSCAPE=1
          $r books-burst-landscape TasteB36UITests/testD_burst 600 TASTE_LANDSCAPE=1
          $r books-portraitpanel TasteB36UITests/testJ_portraitPanel 900
          $r books-placeholder-landscape TasteB36UITests/testI_placeholder 600 TASTE_LANDSCAPE=1
          $r books-numbers-landscape TasteB36UITests/testA_numbers 900 TASTE_LANDSCAPE=1
          $r books-taprate-landscape TasteB36UITests/testF_tapRate 900 TASTE_LANDSCAPE=1
          $r aris-place-remote TasteB36/testE_PlaceByHand 1500 R2_REMOTE=20
          $r aris-jumps TasteB36/testC_Jumps 900
          $r books-global-landscape TasteB36UITests/testC_global 900 TASTE_LANDSCAPE=1
          $r books-rowfeel TasteB36UITests/testH_rowFeel 900
      - name: Close the logs
        if: always()
        run: |
          pkill -f "log stream --style compact" || true
          cp "$RUNNER_TEMP/load.log" "$RUNNER_TEMP/out/" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b36-ipad
          retention-days: 7
          path: ${{ runner.temp }}/out

  duo:
    name: iPhone Duo
    needs: ipad
    if: ${{ !cancelled() }}
    runs-on: xcode-27
    timeout-minutes: 345
    env:
      DEVICE: iPhone Duo
      SIM: gatefold-duo
    steps:
      - run: echo "JOB_DEADLINE=$(( $(date +%s) + 345 * 60 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: ./.github/actions/select-xcode
      - name: Start the simulator booting
        run: python3 -I scripts/ci-simulator.py start "$SIM" "$DEVICE"
      - name: Sample the runner's load every 20 s
        run: |
          # shellcheck disable=SC2016
          nohup sh -c 'while :; do echo "== $(date -u +%T) $(sysctl -n vm.loadavg)"; sleep 20; done' >> "$RUNNER_TEMP/load.log" 2>&1 &
      - name: Install the Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Generate the project
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate
      - name: Build the app and its tests
        timeout-minutes: 40
        run: |
          set -o pipefail
          xcodebuild build-for-testing -project Gatefold.xcodeproj -scheme Gatefold \
            -destination 'generic/platform=iOS Simulator' ARCHS="$(uname -m)" \
            -derivedDataPath "$RUNNER_TEMP/dd" 2>&1 | tee "$RUNNER_TEMP/build.log" | tail -40
          echo "XCTESTRUN=$(ls "$RUNNER_TEMP"/dd/Build/Products/*.xctestrun | head -1)" >> "$GITHUB_ENV"
      - name: The simulator finished booting
        timeout-minutes: 30
        env:
          CI_SIMULATOR_BUDGET: "1740"
        run: python3 -I scripts/ci-simulator.py wait "$SIM" "$DEVICE" 1200
      - name: Open DeviceHub
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            swiftc -Onone .github/scripts/duo/devicehub.swift -o "$RUNNER_TEMP/devicehub" && break
            [ "$attempt" = 3 ] && exit 1
            sleep 10
          done
          sleep 30
          open -a "$(xcode-select -p)/../Applications/DeviceHub.app"
          sleep 20
          "$RUNNER_TEMP/devicehub" dump
          echo "HUB=$RUNNER_TEMP/devicehub" >> "$GITHUB_ENV"
      - name: Keep the app's place and reader logs (never the book's words)
        run: |
          mkdir -p "$RUNNER_TEMP/out" "$RUNNER_TEMP/xcr"
          xcrun simctl io "$UDID" enumerate > "$RUNNER_TEMP/out/io-enumerate.txt" 2>&1 || true
          nohup sh -c 'xcrun simctl spawn "$0" log stream --style compact --predicate "subsystem == \"bot.ouro.gatefold\" AND category == \"reader\"" 2>/dev/null \
            | grep --line-buffered -v -E "text:|\] visible|\] anchor[: ]" >> "$1"' "$UDID" "$RUNNER_TEMP/out/reader.log" >/dev/null 2>&1 &
      - name: Reviewer tests, one at a time, recorded on both screens
        timeout-minutes: 300
        env:
          OUT: ${{ runner.temp }}/out
          DISPLAYS: "1 3"
        run: |
          r=.github/scripts/review/run.sh
          # One recorder per test: simctl io records one display at a time (build 25's second recorder failed).
          # Display 1 is the cover screen (folded), display 3 the inner screen (open).
          DISPLAYS=1 $r spazz-duo TasteB36UITests/testS_spazz 4200 POSE=Closed TASTE_FOLD=1 TASTE_ROUNDS=2
          DISPLAYS=1 $r duo-poses TasteB36UITests/testN_duoPoses 1500 POSE=Closed
          DISPLAYS=3 $r aris-duo-open TasteB36/testD_Duo 1800 POSE=Open
          DISPLAYS=1 $r aris-place-duo-closed TasteB36/testE_PlaceByHand 1500 POSE=Closed
          DISPLAYS=3 $r aris-place-duo-open TasteB36/testE_PlaceByHand 1500 POSE=Open
          DISPLAYS=3 $r books-chain-duo-open TasteB36UITests/testB_reopenChain 1800 POSE=Open
          DISPLAYS=3 $r books-catchup-duo-open TasteB36UITests/testL_catchUp 600 POSE=Open
          DISPLAYS=3 $r books-looks-duo-open TasteB36UITests/testM_looks 900 POSE=Open
          DISPLAYS=1 $r books-looks-duo-closed TasteB36UITests/testM_looks 900 POSE=Closed
          DISPLAYS=3 $r books-contents-duo-open TasteB36UITests/testK_contentsJump 900 POSE=Open
          DISPLAYS=3 $r books-numbers-duo-open TasteB36UITests/testA_numbers 900 POSE=Open
          DISPLAYS=3 $r books-burst-duo-open TasteB36UITests/testD_burst 600 POSE=Open
      - name: Close the logs
        if: always()
        run: |
          pkill -f "log stream --style compact" || true
          cp "$RUNNER_TEMP/load.log" "$RUNNER_TEMP/out/" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b36-duo
          retention-days: 7
          path: ${{ runner.temp }}/out
