name: Duo tour

# Photographs Gatefold on an iPhone Duo simulator in its real poses: shut (cover screen), open flat (the
# spread, gutter on the fold) and stood half-open (tabletop). DeviceHub (Xcode 27.1) moves the hinge; the
# helper in .github/scripts/duo drives its window through accessibility. It also records the page curl and
# a fold from the spread to tabletop that keeps the page. Because it drives a window, it runs on demand
# and when the tour itself changes, not on every pull request.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/duo-tour.yml
      - .github/scripts/duo/**

permissions:
  contents: read

concurrency:
  group: duo-tour-${{ github.ref }}
  cancel-in-progress: true

jobs:
  duo-tour:
    name: Duo tour
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      APP: bot.ouro.gatefold
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/select-xcode
      - name: Install the Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Generate the project
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate
      - name: Create and boot an iPhone Duo
        id: sim
        run: |
          set -euo pipefail
          runtime="$(xcrun simctl list runtimes --json | python3 -c 'import json,sys; r=[x for x in json.load(sys.stdin)["runtimes"] if x["platform"]=="iOS" and x["isAvailable"] and any(d["name"].startswith("iPhone Duo") for d in x.get("supportedDeviceTypes",[]))]; print(max(r, key=lambda x: [int(p) for p in x["version"].split(".")])["identifier"])')"
          udid="$(xcrun simctl create gatefold-duo com.apple.CoreSimulator.SimDeviceType.iPhone-Duo "$runtime")"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          echo "destination=platform=iOS Simulator,arch=$(uname -m),id=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
      - name: Build the app and the demo UI test
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/duo/shots"
          xcodebuild build-for-testing -project Gatefold.xcodeproj -scheme Gatefold \
            -destination "${{ steps.sim.outputs.destination }}" -only-testing:GatefoldUITests/DemoUITests \
            -derivedDataPath "$RUNNER_TEMP/duo/DerivedData" CODE_SIGNING_ALLOWED=NO 2>&1 | tail -40
          # CoreSimulator sometimes restarts right after a build ("Mach error -308, server died"); wait for the device and try again.
          for attempt in 1 2 3; do
            xcrun simctl bootstatus "${{ steps.sim.outputs.udid }}" -b >/dev/null 2>&1 || true
            if xcrun simctl install "${{ steps.sim.outputs.udid }}" "$RUNNER_TEMP/duo/DerivedData/Build/Products/Debug-iphonesimulator/Gatefold.app"; then break; fi
            [ "$attempt" = 3 ] && exit 1
            sleep 15
          done
      - name: Open DeviceHub
        run: |
          set -euo pipefail
          # A busy runner can time the compiler out (signal 14); the helper needs no optimisation, so build it plain and retry.
          for attempt in 1 2 3; do
            swiftc -Onone .github/scripts/duo/devicehub.swift -o "$RUNNER_TEMP/duo/devicehub" && break
            [ "$attempt" = 3 ] && exit 1
            sleep 10
          done
          sleep 30
          open -a "$(xcode-select -p)/../Applications/DeviceHub.app"
          sleep 20
          "$RUNNER_TEMP/duo/devicehub" dump
      - name: Photograph every pose
        run: |
          set -uo pipefail
          udid="${{ steps.sim.outputs.udid }}"
          hub="$RUNNER_TEMP/duo/devicehub"
          shots="$RUNNER_TEMP/duo/shots"
          base=(-GatefoldSkipWelcome YES -GatefoldSignedIn YES -GatefoldDownloadAll YES)
          book=(-GatefoldOpenBook gutenberg-pride-and-prejudice -GatefoldGoTo 0.31)
          shoot() { for d in 1 3; do xcrun simctl io "$udid" screenshot --display=$d "$shots/$1-display$d.png" >/dev/null 2>&1 || true; done; }
          scenes() {
            xcrun simctl launch --terminate-running-process "$udid" "$APP" "${base[@]}" >/dev/null; sleep 12; shoot "$1-library"
            xcrun simctl launch --terminate-running-process "$udid" "$APP" "${base[@]}" "${book[@]}" -GatefoldTheme vellum >/dev/null; sleep 20; shoot "$1-reader-light"
            xcrun simctl launch --terminate-running-process "$udid" "$APP" "${base[@]}" "${book[@]}" -GatefoldTheme midnight >/dev/null; sleep 20; shoot "$1-reader-dark"
          }
          "$hub" press "Closed"; sleep 6; scenes 1-folded
          "$hub" press "Open"; sleep 6; scenes 2-spread
          "$hub" press "Rotate Right"; sleep 4; "$hub" press "Partially Open"; sleep 6; scenes 3-tabletop
          screencapture -x "$shots/0-devicehub-tabletop.png" || true
      - name: Record a fold from the spread to tabletop, keeping the page
        run: |
          set -uo pipefail
          udid="${{ steps.sim.outputs.udid }}"
          hub="$RUNNER_TEMP/duo/devicehub"
          "$hub" press "Open"; sleep 4
          for turn in 1 2 3; do "$hub" press "Rotate Right"; sleep 3; done
          xcrun simctl launch --terminate-running-process "$udid" "$APP" -GatefoldSkipWelcome YES -GatefoldSignedIn YES \
            -GatefoldDownloadAll YES -GatefoldOpenBook gutenberg-pride-and-prejudice -GatefoldGoTo 0.31 -GatefoldTheme vellum >/dev/null
          sleep 20
          xcrun simctl io "$udid" recordVideo --display=3 --codec=h264 --force "$RUNNER_TEMP/duo/shots/fold-spread-to-tabletop.mp4" &
          rec=$!
          sleep 3
          "$hub" press "Rotate Right"; sleep 4
          "$hub" press "Partially Open"; sleep 6
          "$hub" press "Open"; sleep 4
          for turn in 1 2 3; do "$hub" press "Rotate Right"; sleep 3; done
          sleep 4
          kill -INT "$rec"; wait "$rec" || true
      - name: Record the page curl on the cover screen
        run: |
          set -uo pipefail
          udid="${{ steps.sim.outputs.udid }}"
          "$RUNNER_TEMP/duo/devicehub" press "Closed"; sleep 6
          xcrun simctl io "$udid" recordVideo --display=1 --codec=h264 --force "$RUNNER_TEMP/duo/shots/page-curl.mp4" &
          rec=$!
          sleep 2
          status=0
          xcodebuild test-without-building -project Gatefold.xcodeproj -scheme Gatefold \
            -destination "${{ steps.sim.outputs.destination }}" -only-testing:GatefoldUITests/DemoUITests \
            -retry-tests-on-failure -test-iterations 2 \
            -derivedDataPath "$RUNNER_TEMP/duo/DerivedData" -resultBundlePath "$RUNNER_TEMP/duo/demo.xcresult" \
            > "$RUNNER_TEMP/duo/demo.log" 2>&1 || status=$?
          # Stop the recorder whatever happened, so the video is written out.
          kill -INT "$rec" || true; wait "$rec" || true
          grep -E "error:|Test Case .*(passed|failed)|TEST (EXECUTE )?(SUCCEEDED|FAILED)" "$RUNNER_TEMP/duo/demo.log" | tail -30 || true
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: duo-tour
          path: |
            ${{ runner.temp }}/duo/shots
            ${{ runner.temp }}/duo/demo.xcresult
            ${{ runner.temp }}/duo/demo.log
