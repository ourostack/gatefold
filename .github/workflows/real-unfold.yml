name: Real unfold

# Opens and shuts an iPhone Duo simulator's hinge through DeviceHub (the Duo tour's helper) with a book
# open, and judges each unfold from the app's own "reflow check" log line: did the spread keep his words?
# It drives a window; it is the posture gate (the UI test can't move a hinge, and a spread forced on the folded cover
# is no reader's layout). Like App's macOS jobs (#531), it unfolds on pushes to main that touch the reader or the app
# shell, and on demand, never on a pull request or in the merge queue (`changes` output `native`): there the gate
# reports success by saying so, and the Linux checks judge the change. A red main is the alarm, the central auto-revert
# reverts the culprit, and TestFlight publishes only a commit whose own main run passed. A red main is fixed as
# AGENTS.md says ("CI").
#
# One build, five places at once (gatefold#39's pattern): `Build for testing` builds the app for the simulator once and
# uploads it; each place's job boots its own iPhone Duo and opens DeviceHub while that build runs, waits for it
# (.github/actions/await-build), installs it and unfolds at its place: three rounds and a half open, then its share of
# the eight early unfolds. One job held all five places in a row (about 43 min of unfolds, 62 to 81 min a run). Each
# job stops starting unfolds in time to print its verdicts and upload its logs, and is red for the unfolds it never
# made (gatefold#391).
#
# The required check `Real unfold` is the gate job at the end: green when every place passed; on a pull request that
# doesn't touch the reader; or on a main push whose tree the merge queue's run or a pull request's already unfolded and
# passed (its job "Real unfold passed on tree <tree>"; scripts/ci-proof.py). A main push without that proof unfolds.

on:
  workflow_dispatch:
    inputs:
      rounds:
        description: Unfolds at each place in the book
        default: "3"
  # Every pull request, because Real unfold is a required check: on one that doesn't touch the reader the gate reports
  # success without unfolding (a workflow-level path filter never reported, so such a pull request waited forever;
  # gatefold#42).
  pull_request:
  merge_group:
  push:
    branches: [main]

# The places read this run's jobs and artifacts to wait for the build (.github/actions/await-build).
permissions:
  contents: read
  actions: read

# Pushes to main share one group, as App's do (gatefold#246): a started run is never cancelled, and only the newest
# waiting push runs next, covering every merge since the last run.
concurrency:
  group: >-
    real-unfold-${{ github.event_name == 'pull_request' && github.ref
    || github.event_name == 'push' && github.run_attempt == 1 && 'main' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Does it touch the reader?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      reader: ${{ steps.diff.outputs.reader }}
      native: ${{ steps.native.outputs.native }}
      tree: ${{ steps.tree.outputs.tree }}
      proven: ${{ steps.proof.outputs.proven }}
      proof: ${{ steps.proof.outputs.proof }}
    # The proof reads which pull request was merged as this commit, and that run's jobs.
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: tree
        name: The tree this run tests (the proof job names it)
        run: echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
      - id: native
        name: Does this run unfold on a Mac? (main pushes and dispatches only)
        env:
          EVENT: ${{ github.event_name }}
        run: if [ "$EVENT" = pull_request ] || [ "$EVENT" = merge_group ]; then echo "native=false" >> "$GITHUB_OUTPUT"; else echo "native=true" >> "$GITHUB_OUTPUT"; fi
      - id: proof
        name: Has the merge queue or a pull request already unfolded this tree? (main pushes and the merge queue)
        if: github.event_name == 'push' || github.event_name == 'merge_group'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          TREE: ${{ steps.tree.outputs.tree }}
        run: |
          # The merge queue: another group's run that passed on this very tree (a re-enqueue after a runner fault).
          if [ "$EVENT" = merge_group ]; then where=(--tree "$TREE" --run "$GITHUB_RUN_ID"); else where=(--sha "$GITHUB_SHA"); fi
          python3 -I scripts/ci-proof.py "${where[@]}" --workflow real-unfold.yml --prefix "Real unfold passed on tree " \
            > proof.txt 2>&1 || echo "Not proven: the unfolds run." >> proof.txt
          cat proof.txt | tee -a "$GITHUB_STEP_SUMMARY"
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.event.after }}
        run: |
          set -eu
          # A dispatch, a new branch (no base) or a base the checkout can't read unfolds, as before.
          if [ "$EVENT" = workflow_dispatch ] || [ -z "${BASE//0/}" ] || ! git diff --name-only "$BASE...$HEAD" > changed.txt; then echo "reader=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # The reader, the fold and the app shell it runs in; GatefoldCore; the Readium link; the project; the hinge driver.
          if grep -E '^(\.github/(workflows/real-unfold(-place)?\.yml|scripts/duo/|scripts/boot-sim\.sh|actions/)|Gatefold/(Reader|Duo|App)/|Packages/GatefoldCore/|Packages/GatefoldCloud/(Package\.(swift|resolved)$|Sources/GatefoldCloudReadium/)|project\.yml$)' changed.txt; then
            echo "reader=true" >> "$GITHUB_OUTPUT"
          else
            echo "reader=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build for testing
    needs: changes
    # A failed `changes` leaves the outputs empty, so it builds rather than skipping as a pass.
    if: ${{ !cancelled() && needs.changes.outputs.native != 'false' && needs.changes.outputs.reader != 'false' && needs.changes.outputs.proven != 'true' }}
    runs-on: xcode-27
    timeout-minutes: 35
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/select-xcode
      - id: name
        name: Name the build by commit and Xcode version (the places' await-build looks for this name)
        run: echo "artifact=gatefold-tests-${{ github.sha }}-xcode-$(xcodebuild -version | tr -s ' \n' '-' | sed 's/-$//; s/^Xcode-//; s/-Build-version-/-/')" >> "$GITHUB_OUTPUT"
      - name: Install the Metal toolchain (the page curl is a Metal shader)
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Generate the Xcode project from project.yml
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate
      - name: Build the app for the simulator, once
        # The same build as App's `Build for testing` (13 to 16 min); the places install its Gatefold.app.
        timeout-minutes: 25
        run: |
          set -o pipefail
          xcodebuild build-for-testing -project Gatefold.xcodeproj -scheme Gatefold \
            -destination 'generic/platform=iOS Simulator' ARCHS="$(uname -m)" \
            -derivedDataPath "$RUNNER_TEMP/dd" 2>&1 | tee "$RUNNER_TEMP/build.log" | tail -60
          ls "$RUNNER_TEMP"/dd/Build/Products/Debug-iphonesimulator/Gatefold.app/Gatefold
          tar -czf "$RUNNER_TEMP/products.tgz" -C "$RUNNER_TEMP/dd/Build" Products
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.artifact }}
          path: ${{ runner.temp }}/products.tgz
          retention-days: 5
          compression-level: 0
          overwrite: true
      - uses: actions/upload-artifact@v4
        if: failure() || cancelled()
        with:
          name: real-unfold-build-log
          path: ${{ runner.temp }}/build.log
          overwrite: true
      # Merge queue only, last: a failed build cancels the other runs on this commit (.github/actions/fail-fast).
      - if: failure() && github.event_name == 'merge_group'
        uses: ./.github/actions/fail-fast

  unfold:
    name: Unfold at ${{ matrix.place }}
    needs: changes
    # Starts with the run, so the simulator boots and DeviceHub opens while `build` builds. A failed `changes` leaves
    # the outputs empty, so the unfolds run rather than skipping as a pass.
    if: ${{ !cancelled() && needs.changes.outputs.native != 'false' && needs.changes.outputs.reader != 'false' && needs.changes.outputs.proven != 'true' }}
    strategy:
      # Every place gives its verdict, on a pull request too: one red place says nothing about the others.
      fail-fast: false
      matrix:
        include:
          # Five places in the book, and the eight early unfolds spread over them (0.12, 0.31 and 0.47 get two).
          - place: "0.12"
            early: "0.12 0.12"
            timeout: 77
            lane: 1
          - place: "0.31"
            early: "0.31 0.31"
            timeout: 77
            lane: 2
          - place: "0.47"
            early: "0.47 0.47"
            timeout: 77
            lane: 3
          - place: "0.66"
            early: "0.66"
            timeout: 77
            lane: 4
          - place: "0.83"
            early: "0.83"
            timeout: 77
            lane: 5
    # Read: the build's artifact (await-build). Write: the merge queue's fail-fast cancels (.github/actions/fail-fast).
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/real-unfold-place.yml
    with:
      place: ${{ matrix.place }}
      early: ${{ matrix.early }}
      rounds: ${{ inputs.rounds || '3' }}
      timeout: ${{ matrix.timeout }}
      lane: ${{ matrix.lane }}

  # A place GitHub cancelled from outside (during the simulator's first boot; gatefold#404, as App's shards) unfolds
  # again in this run, on a fresh runner, as soon as every place has ended. A run with a cancelled job ends "cancelled"
  # whatever else passes, so the gate and the proof read `retry-verdict`: green when every place passed, or was
  # cancelled and passed on its retry. A place that failed is never retried (scripts/ci-retry.py, shared with App's).
  retry-plan:
    name: Which places were cancelled
    needs: [changes, unfold]
    if: ${{ !cancelled() && needs.changes.outputs.native != 'false' && needs.changes.outputs.reader != 'false' && needs.changes.outputs.proven != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW: real-unfold.yml
        run: python3 -I scripts/ci-retry.py plan

  retry:
    name: Retry (${{ matrix.place }})
    needs: [changes, retry-plan]
    if: ${{ !cancelled() && needs.retry-plan.outputs.count != '' && needs.retry-plan.outputs.count != '0' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.retry-plan.outputs.matrix) }}
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/real-unfold-place.yml
    with:
      place: ${{ matrix.place }}
      early: ${{ matrix.early }}
      rounds: ${{ inputs.rounds || '3' }}
      timeout: ${{ matrix.timeout }}
      lane: ${{ matrix.lane }}
      try: "-retry"

  retry-verdict:
    name: Judge the places after their retries
    needs: [changes, retry-plan, retry]
    if: ${{ !cancelled() && needs.changes.outputs.native != 'false' && needs.changes.outputs.reader != 'false' && needs.changes.outputs.proven != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      unfold: ${{ steps.verdict.outputs.unfold }}
    steps:
      - uses: actions/checkout@v4
      - id: verdict
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW: real-unfold.yml
        run: python3 -I scripts/ci-retry.py verdict

  # The required check. Never skipped, so it always reports.
  real-unfold:
    name: Real unfold
    needs: [changes, build, unfold, retry-verdict]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          EVENT: ${{ github.event_name }}
          READER: ${{ needs.changes.outputs.reader }}
          NATIVE: ${{ needs.changes.outputs.native }}
          BUILD: ${{ needs.build.result }}
          UNFOLD: ${{ needs.unfold.result }}
          RETRIED: ${{ needs.retry-verdict.outputs.unfold }}
          PROVEN: ${{ needs.changes.outputs.proven }}
          PROOF: ${{ needs.changes.outputs.proof }}
        run: |
          if [ "$NATIVE" = false ]; then echo "The unfolds run on main after the merge, not on a pull request or in the merge queue."; exit 0; fi
          if [ "$PROVEN" = true ]; then echo "::notice::Passed by proof: every unfold passed on this tree in $PROOF"; exit 0; fi
          if [ "$READER" = false ]; then echo "This change doesn't touch the reader, so the unfolds have nothing to judge."; exit 0; fi
          echo "Build: $BUILD; unfolds at every place: $UNFOLD; after retrying the cancelled ones: ${RETRIED:-not judged}"
          # A place GitHub cancelled and the `retry` job unfolded again counts as passed; a failed place never does.
          [ "$BUILD" = success ] || exit 1
          [ "$UNFOLD" = success ] || { [ "$RETRIED" = ok ] && [ "$UNFOLD" != skipped ]; }

  # The proof a main push reads (scripts/ci-proof.py): every unfold ran and passed on this tree, with the usual rounds.
  proof:
    name: Real unfold passed on tree ${{ needs.changes.outputs.tree }}
    needs: [changes, build, unfold, retry-verdict]
    # A run that passed by proof (its build and unfolds skipped) ends with it too, so main's push finds it on the merged
    # commit.
    if: ${{ !cancelled() && ((needs.build.result == 'success' && (needs.unfold.result == 'success' || (needs.retry-verdict.outputs.unfold == 'ok' && needs.unfold.result != 'skipped'))) || needs.changes.outputs.proven == 'true') && needs.changes.outputs.tree != '' && github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "Every unfold passed on tree ${{ needs.changes.outputs.tree }}."
