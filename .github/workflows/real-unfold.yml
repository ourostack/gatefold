name: Real unfold

# Opens and shuts an iPhone Duo simulator's hinge through DeviceHub (the Duo tour's helper) with a book
# open, and judges each unfold from the app's own "reflow check" log line: did the spread keep his words?
# It drives a window; it is the posture gate (the UI test can't move a hinge, and a spread forced on the folded cover
# is no reader's layout). It is the main tier: it runs on every push to main and on demand, never cancelled. It takes
# 45 to 75 min, too long for the PR clock (gatefold#39), so on a pull request the job skips, which reports success
# under the same required name. A red main is fixed as AGENTS.md says ("CI"). On a slow host it stops starting unfolds
# in time to print its verdicts and upload its logs, and is red for the unfolds it never made (gatefold#391).

on:
  workflow_dispatch:
    inputs:
      rounds:
        description: Unfolds at each place in the book
        default: "3"
  # Every pull request, because Real unfold is a required check: the job skips there, which reports success (a
  # workflow-level path filter never reported, so such a pull request waited forever; gatefold#42).
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: real-unfold-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Does it touch the reader?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      reader: ${{ steps.diff.outputs.reader }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          if [ "$EVENT" != pull_request ]; then echo "reader=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          git diff --name-only "$BASE...$HEAD" > changed.txt
          # The reader, the fold and the app shell it runs in; GatefoldCore; the Readium link; the project; the hinge driver.
          if grep -E '^(\.github/(workflows/real-unfold\.yml|scripts/duo/|actions/)|Gatefold/(Reader|Duo|App)/|Packages/GatefoldCore/|Packages/GatefoldCloud/(Package\.(swift|resolved)$|Sources/GatefoldCloudReadium/)|project\.yml$)' changed.txt; then
            echo "reader=true" >> "$GITHUB_OUTPUT"
          else
            echo "reader=false" >> "$GITHUB_OUTPUT"
          fi

  real-unfold:
    name: Real unfold
    needs: changes
    # Main and dispatch only (see the top). A failed `changes` leaves the output empty, so the unfold runs rather than
    # skipping as a pass.
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.changes.outputs.reader != 'false' }}
    runs-on: xcode-27
    timeout-minutes: 75
    env:
      APP: bot.ouro.gatefold
    steps:
      # The unfolds stop in time for their verdicts and the upload, counted from here (gatefold#391).
      - run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: ./.github/actions/select-xcode
      - name: Install the Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Generate the project
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate
      - name: Create and boot an iPhone Duo
        id: sim
        run: |
          set -euo pipefail
          runtime="$(xcrun simctl list runtimes --json | python3 -c 'import json,sys; r=[x for x in json.load(sys.stdin)["runtimes"] if x["platform"]=="iOS" and x["isAvailable"] and any(d["name"].startswith("iPhone Duo") for d in x.get("supportedDeviceTypes",[]))]; print(max(r, key=lambda x: [int(p) for p in x["version"].split(".")])["identifier"])')"
          udid="$(.github/scripts/boot-sim.sh gatefold-duo com.apple.CoreSimulator.SimDeviceType.iPhone-Duo "$runtime")"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - name: Build and install the app
        # 16 min measured at most; 16 / 0.7. Run 42393941976 hung here 75 min and lost its log (#35).
        timeout-minutes: 23
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/unfold/shots"
          echo "$(date -u +%T) building"
          xcodebuild build -project Gatefold.xcodeproj -scheme Gatefold \
            -destination "platform=iOS Simulator,arch=$(uname -m),id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath "$RUNNER_TEMP/unfold/DerivedData" CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/unfold/build.log" \
            | grep --line-buffered -E "error:|BUILD (SUCCEEDED|FAILED)|^(Compil|Link|Process|Sign)[A-Za-z]* " | awk 'NR % 25 == 1 || /error:|BUILD/ { print; fflush() }'
          echo "$(date -u +%T) built; installing"
          for attempt in 1 2 3; do
            xcrun simctl bootstatus "${{ steps.sim.outputs.udid }}" -b >/dev/null 2>&1 || true
            echo "$(date -u +%T) install attempt $attempt"
            if xcrun simctl install "${{ steps.sim.outputs.udid }}" "$RUNNER_TEMP/unfold/DerivedData/Build/Products/Debug-iphonesimulator/Gatefold.app"; then break; fi
            [ "$attempt" = 3 ] && exit 1
            sleep 15
          done
      - name: Open DeviceHub
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            swiftc -Onone .github/scripts/duo/devicehub.swift -o "$RUNNER_TEMP/unfold/devicehub" && break
            [ "$attempt" = 3 ] && exit 1
            sleep 10
          done
          sleep 30
          open -a "$(xcode-select -p)/../Applications/DeviceHub.app"
          sleep 20
          "$RUNNER_TEMP/unfold/devicehub" dump
      - name: Unfold with a book open, at five places
        run: |
          set -uo pipefail
          udid="${{ steps.sim.outputs.udid }}"
          hub="$RUNNER_TEMP/unfold/devicehub"
          out="$RUNNER_TEMP/unfold"
          xcrun simctl spawn "$udid" log stream --style compact \
            --predicate 'subsystem == "bot.ouro.gatefold" AND category == "reader"' > "$out/reader.log" 2>&1 &
          stream=$!
          # A slow host stretches every step: past this, no new unfold starts, so the verdicts on those already made
          # still print and the logs still upload before the job's 75-min limit (gatefold#391). 10 min for those.
          stop_at=$(( JOB_START + (75 - 10) * 60 ))
          rounds="${{ inputs.rounds || '3' }}"
          planned=$(( 5 * (rounds + 1) + 8 ))
          out_of_time=0 stalled=0
          in_time() {
            [ "$stalled" = 0 ] || return 1
            [ "$(date +%s)" -lt "$stop_at" ] && return 0
            [ "$out_of_time" = 1 ] || echo "::error::out of time at $(date -u +%T): no more unfolds, so the job can print its verdicts and upload its logs"
            out_of_time=1
            return 1
          }
          # Each press has 120 s and one retry (gatefold#149): a stall names its press and the app's latest main-thread
          # hold, never spends the job in silence. A press that answers late is named too.
          press() {
            local try t0 took status
            for try in 1 2; do
              t0=$(date +%s)
              # The step runs under bash -e: the status is taken, never left to end the step.
              status=0
              perl -e 'alarm shift; exec @ARGV' 120 "$hub" press "$1" || status=$?
              took=$(( $(date +%s) - t0 ))
              # 142 is the alarm's SIGALRM. Any other status is the press's own answer (not found, refused): named, and
              # left to the verdicts, as before.
              if [ "$status" != 142 ]; then
                [ "$status" = 0 ] || echo "::warning::press $1 answered status $status"
                [ "$took" -lt 30 ] || echo "::warning::press $1 took $took s"
                return 0
              fi
              echo "::warning::press $1 gave no answer in 120 s (try $try); the app's latest main-thread note: $(grep -E 'main: (still held|held) ' "$out/reader.log" | tail -1 | sed -E 's/^[0-9-]+ //' | cut -c1-160)"
            done
            echo "::error::press $1 stalled twice"
            stalled=1
            return 1
          }
          unfolds() {
          for place in 0.12 0.31 0.47 0.66 0.83; do
            press "Closed" || return 1; sleep 6
            xcrun simctl launch --terminate-running-process "$udid" "$APP" -GatefoldUITest YES -GatefoldFakeCloud YES \
              -GatefoldReset YES -GatefoldSkipWelcome YES -GatefoldSignedIn YES -GatefoldDownloadAll YES \
              -GatefoldOpenBook gutenberg-pride-and-prejudice -GatefoldGoTo "$place" >/dev/null
            sleep 30
            for round in $(seq 1 "$rounds"); do
              in_time || return 1
              echo "UNFOLD place $place round $round" | tee -a "$out/marks.log"
              press "Open" || return 1; sleep 14
              xcrun simctl io "$udid" screenshot --display=3 "$out/shots/$place-$round-open.png" >/dev/null 2>&1 || true
              press "Closed" || return 1; sleep 12
            done
            # Half open: tabletop on the inner screen, then flat again and folded.
            in_time || return 1
            echo "HALF OPEN place $place" | tee -a "$out/marks.log"
            press "Open" || return 1; sleep 12
            press "Partially Open" || return 1; sleep 14
            xcrun simctl io "$udid" screenshot --display=3 "$out/shots/$place-half.png" >/dev/null 2>&1 || true
            press "Open" || return 1; sleep 12
            press "Closed" || return 1; sleep 12
          done
          # Early unfolds: opened folded, then unfolded 2 s after the page shows, as the posture test
          # switches (the reviewer's failures came on the first switch after launch).
          for place in 0.12 0.31 0.47 0.66 0.83 0.12 0.31 0.47; do
            in_time || return 1
            press "Closed" || return 1; sleep 6
            shown="$(grep -c "open: page shown" "$out/reader.log" || true)"
            xcrun simctl launch --terminate-running-process "$udid" "$APP" -GatefoldUITest YES -GatefoldFakeCloud YES \
              -GatefoldReset YES -GatefoldSkipWelcome YES -GatefoldSignedIn YES -GatefoldDownloadAll YES \
              -GatefoldOpenBook gutenberg-pride-and-prejudice -GatefoldGoTo "$place" >/dev/null
            for wait in $(seq 1 120); do
              [ "$(grep -c "open: page shown" "$out/reader.log" || true)" -gt "$shown" ] && break
              sleep 0.5
            done
            sleep 2
            echo "EARLY UNFOLD place $place" | tee -a "$out/marks.log"
            echo "EARLY UNFOLD place $place" >> "$out/reader.log"
            press "Open" || return 1; sleep 16
            xcrun simctl io "$udid" screenshot --display=3 "$out/shots/early-$place-$wait.png" >/dev/null 2>&1 || true
          done
          }
          # The flags carry how it ended; the verdicts below print either way.
          : > "$out/marks.log"
          unfolds || true
          kill "$stream" || true
          grep -E "reflow check|reflow begins|host size|layout (single|spread|tabletop)|spread: " "$out/reader.log" | sed -E 's/^[0-9-]+ //' | tail -200
          echo "--- verdicts after an unfold (two columns) ---"
          spreads="$(grep "reflow check" "$out/reader.log" | grep "columns 2" || true)"
          echo "$spreads" | grep -o "anchor-[a-z]*" | sort | uniq -c
          echo "--- every verdict (unfold, half open, fold) ---"
          verdicts="$(grep "reflow check" "$out/reader.log" || true)"
          echo "$verdicts" | grep -o "anchor-[a-z]*" | sort | uniq -c
          echo "--- half-open posture changes ---"
          grep -c "reflow begins: posture" "$out/reader.log" || true
          echo "--- the app's main thread held a minute or more ---"
          grep -E "main: held [0-9]+ ms" "$out/reader.log" | awk '{ for (i = 1; i < NF; i++) if ($i == "held" && $(i + 1) >= 60000) print "::warning::the app'"'"'s main thread was held " int($(i + 1) / 1000) " s, ending " $2 }'
          # No posture change may have lost his words, and every unfold must have been judged.
          if echo "$verdicts" | grep -q "anchor-lost"; then echo "::error::a posture change lost the reader's words"; exit 1; fi
          # Its verdicts printed, a run cut short is still red: the unfolds it never made weren't judged.
          [ "$stalled" = 0 ] || { echo "::error::a DeviceHub press stalled twice, so the unfolds after it never ran ($(grep -c "" "$out/marks.log") of $planned begun)"; exit 1; }
          [ "$out_of_time" = 0 ] || { echo "::error::the unfolds stopped for time with $(grep -c "" "$out/marks.log") of $planned begun"; exit 1; }
          [ -n "$spreads" ] || { echo "::error::no unfold reached a spread"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-unfold
          path: |
            ${{ runner.temp }}/unfold/reader.log
            ${{ runner.temp }}/unfold/build.log
            ${{ runner.temp }}/unfold/marks.log
            ${{ runner.temp }}/unfold/shots
