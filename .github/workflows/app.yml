name: App

# Two tiers (gatefold#39, #198). A pull request runs the build, the unit tests, GatefoldCore and at most five UI shards,
# picked by the paths it touches: an iPad and a Duo smoke on every app change, and the place and taps guards when it
# touches that code (`changes` output `fired`; the lists are the Gatefold agent's). Every push to main runs the full UI
# suite and is never cancelled; a red main is fixed as AGENTS.md says ("CI"). Each new simulator's first boot holds the
# runner's load at 500 to 760 for about 15 min (#198), so fewer shards per pull request is the lever, not more.
#
# Build once: `build` makes the app and its tests for the simulator (build-for-testing) and uploads them, named by
# commit and Xcode version; no simulator job compiles the app again (gatefold#39: each job spent 10 to 16 min building).
# Every simulator job starts with the run (a capped shard, when a slot frees; gatefold#243), boots its new simulator
# (alongside `build`, when it starts with the run), waits for that artifact (.github/actions/await-build) and runs
# test-without-building.
#
# UI tests run in shards (.github/workflows/ui-tests.yml), each on its own runner; a gate job named for each required
# check is green only when all of its shards passed.
#
# A pull request that changes only Markdown still gets every required check: `changes` says so, the test shards skip,
# and each gate job (`iPad (...)`, `Duo (the reviewers' checks)`, `Build and unit-test the app`) reports success
# (gatefold#42). The jobs run unless `changes` said "only Markdown", and a failed `build` turns them red at the wait
# instead of letting them skip, which would count as a pass. A failed `changes` leaves `full` empty, which runs the full
# lists. A pull request that edits the CI runs the full lists; one that edits a UI test class runs it in the smoke shard
# of each device main runs it on (`edited-ipad`, `edited-duo`).

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

# A newer push to a pull request cancels its older run. Pushes to main keep one group per commit and are never
# cancelled.
concurrency:
  group: app-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The shards and the unit job read this run's jobs and artifacts to wait for the build (.github/actions/await-build).
permissions:
  contents: read
  actions: read

jobs:
  changes:
    name: What this change touches
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.diff.outputs.app }}
      full: ${{ steps.diff.outputs.full }}
      fired: ${{ steps.diff.outputs.fired }}
      edited-ipad: ${{ steps.diff.outputs.edited-ipad }}
      edited-duo: ${{ steps.diff.outputs.edited-duo }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          if [ "$EVENT" != pull_request ]; then printf 'app=true\nfull=true\nfired=\nedited-ipad=\nedited-duo=\n' >> "$GITHUB_OUTPUT"; exit 0; fi
          git diff --name-only "$BASE...$HEAD" > changed.txt
          cat changed.txt
          # The CI that runs the UI tests: the full lists.
          if grep -qE '^(\.github/(workflows/(app|ui-tests)\.yml|scripts/|actions/)|scripts/ci-(simulator|shards)\.py|scripts/ci-shards\.expect)' changed.txt; then
            echo "::notice::This change edits the CI that runs the UI tests: the full lists run."
            full=true
          else
            full=false
          fi
          # Which guards this change needs (the Gatefold agent's lists). Anything that builds into the app gets the smoke;
          # a unit-test-only or Markdown-only change gets none.
          place='^(Gatefold/Reader/(ReaderModel|ReaderHostController|ReaderScreen|LandingPlace|BookPositions|ReopenSnapshot|BookOpener|ReaderPage|ReaderJS|Highlights)\.swift|Packages/GatefoldCore/)'
          taps='^(Gatefold/Reader/(ReaderChrome|CurlOverlay|ReaderMoments|ReaderSheets|SettingsPanel|ReaderScreen)\.swift|Gatefold/Reader/PageCurl\.metal|Gatefold/Design/)'
          everything='^(project\.yml|Gatefold\.xcodeproj/|Package\.(swift|resolved)|Gatefold/Resources/|Gatefold/Support/)'
          fired=""
          if grep -qvE '(\.md$|^GatefoldTests/)' changed.txt; then fired="smoke"; fi
          if grep -qE "$place|$everything|^Gatefold/App/" changed.txt; then fired="$fired place-undo"; fi
          if grep -qE "$place|$everything" changed.txt; then fired="$fired place-jumps"; fi
          if grep -qE "$taps|$everything" changed.txt; then fired="$fired taps"; fi
          echo "::notice::Guards for this change: ${fired:-none}"
          echo "fired=$fired" >> "$GITHUB_OUTPUT"
          # A UI test class this change edits runs in the smoke shard of each device main runs it on (the iPad when main
          # runs it nowhere yet), so a new or changed test proves itself here. An edited helper (a file with no test
          # class) changes every test: the full lists.
          python3 -I scripts/ci-shards.py check --list | cut -f1 | grep '^main|' | cut -d'|' -f2,3 | cut -d/ -f1 | sort -u > on-main.txt || true
          ipad="" duo=""
          for f in $(grep -E '^GatefoldUITests/[^/]+\.swift$' changed.txt || true); do
            [ -f "$f" ] || continue
            classes=$(grep -oE 'class [A-Za-z0-9_]+: XCTestCase' "$f" | awk '{print $2}' | tr -d ':')
            if [ -z "$classes" ]; then echo "::notice::$f has no test class: the full lists run."; full=true; fi
            for c in $classes; do
              on_ipad=$(grep -cxF "iPad Pro 13-inch|$c" on-main.txt || true)
              on_duo=$(grep -cxF "iPhone Duo|$c" on-main.txt || true)
              if [ "$on_ipad" != 0 ] || [ "$on_duo" = 0 ]; then ipad="$ipad $c"; fi
              if [ "$on_duo" != 0 ]; then duo="$duo $c"; fi
            done
          done
          # shellcheck disable=SC2086 # word splitting trims the lists
          { echo "full=$full"; set -- $ipad; echo "edited-ipad=$*"; set -- $duo; echo "edited-duo=$*"; } >> "$GITHUB_OUTPUT"
          if grep -qv '\.md$' changed.txt; then echo "app=true" >> "$GITHUB_OUTPUT"; else
            echo "::notice::Only Markdown changed: the app checks report success without running."
            echo "app=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build for testing
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.app != 'false' }}
    runs-on: xcode-27
    timeout-minutes: 35
    outputs:
      artifact: ${{ steps.name.outputs.artifact }}
    steps:
      - uses: actions/checkout@v4
      # Here, not in `changes` (not required): a red build turns every required check red.
      - name: The simulator boot and wait logic passes its selftest (#78)
        run: python3 -I scripts/ci-simulator.py --selftest
      - uses: ./.github/actions/select-xcode
      - name: The test-step stopper passes its selftest (#126)
        run: python3 -I scripts/ci-within.py --selftest
      - id: name
        name: Name the build by commit and Xcode version
        run: echo "artifact=gatefold-tests-${{ github.sha }}-xcode-$(xcodebuild -version | tr -s ' \n' '-' | sed 's/-$//; s/^Xcode-//; s/-Build-version-/-/')" >> "$GITHUB_OUTPUT"
      - name: Install the Metal toolchain (the page curl is a Metal shader)
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Generate the Xcode project from project.yml
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate
      - name: Build the app and its tests for the simulator, once
        # About 13 to 16 min measured in each job that used to build (gatefold#39).
        timeout-minutes: 25
        run: |
          set -o pipefail
          xcodebuild build-for-testing -project Gatefold.xcodeproj -scheme Gatefold \
            -destination 'generic/platform=iOS Simulator' ARCHS="$(uname -m)" \
            -derivedDataPath "$RUNNER_TEMP/dd" 2>&1 | tee "$RUNNER_TEMP/build.log" | tail -60
          ls "$RUNNER_TEMP"/dd/Build/Products/*.xctestrun
          tar -czf "$RUNNER_TEMP/products.tgz" -C "$RUNNER_TEMP/dd/Build" Products
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.artifact }}
          path: ${{ runner.temp }}/products.tgz
          # Long enough for "Re-run failed jobs" a few days later.
          retention-days: 5
          compression-level: 0
          overwrite: true
      - uses: actions/upload-artifact@v4
        if: failure() || cancelled()
        with:
          name: build-log
          path: ${{ runner.temp }}/build.log
          overwrite: true

  core:
    name: GatefoldCore tests
    # GatefoldCore is pure Swift (Foundation only, no UIKit or Readium), so it tests on Linux and
    # spends no macOS minutes. The app's build still compiles it against the iOS 27 SDK below.
    # In Swift's own image: the Ubuntu 26.04 runner image stopped carrying Swift (exit 127 on
    # `swift --version`, 2026-11-05).
    # It also stands for `ci-scripts` (the CI scripts' offline tests), so this required check fails when they do.
    needs: [changes, ci-scripts]
    if: ${{ !cancelled() && needs.changes.outputs.app != 'false' }}
    runs-on: ubuntu-latest
    container: swift:6.2
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: swift test
        run: swift test --package-path Packages/GatefoldCore
      - name: The CI scripts' offline tests passed (job "CI scripts, offline"; gatefold#241)
        if: ${{ !cancelled() }}
        env:
          RESULT: ${{ needs.ci-scripts.result }}
        run: |
          [ "$RESULT" = success ] || { echo "::error title=CI scripts%2C offline::The job \"CI scripts, offline\" ended $RESULT: see its log (simulator helper or UI test lists, not GatefoldCore)"; exit 1; }

  # The CI scripts' offline tests, on the runner image itself, where python3 is installed: in the Swift container they
  # had to fetch it with apt-get, and a DNS blip failed the required check before any test ran (gatefold#241).
  ci-scripts:
    name: CI scripts, offline
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.app != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: python3 --version && bash --version | head -1
      - name: The simulator helper, offline (a fake xcrun; no simulator)
        run: |
          python3 -I scripts/ci-simulator.py --selftest
          bash scripts/test-ci-simulator.sh
      - name: UI test lists (not GatefoldCore) match scripts/ci-shards.expect; fix with `python3 -I scripts/ci-shards.py write` (gatefold#39)
        run: |
          python3 -I scripts/ci-shards.py --selftest
          python3 -I scripts/ci-shards.py check --expect scripts/ci-shards.expect

  # UI tests run in shards, each on its own runner (.github/workflows/ui-tests.yml). A shard starts with the run, or
  # when its matrix has a free slot: it boots its new simulator (alongside `build`, when it starts with the run), then
  # waits for the build's artifact.
  # Per run, each matrix's `max-parallel` caps how many of its shards run at once, so full-list runs leave macOS runners
  # for app pull requests (gatefold#243). The five caps sum to 12 on main and 8 on a pull request running the full lists;
  # one running only its tier is uncapped. GitHub may start a matrix's shards in any order. On main each shard holds about
  # 5 min of tests by its median pass on main (eight runs, 42605267361 to 42905906538). On a pull request a shard runs
  # its `pr_tests` only when its `pr_when` group is in `changes`' `fired`; every other shard reports from a no-op job.
  # Each `timeout` is 12 min of setup (the boot and the wait for the build), plus twice the sum of its tests' slowest
  # passes in those runs, plus 12 for the logs after the tests (gatefold#141). Twice, because on these overloaded runners
  # a test that passes can run 2-3x its usual time; a shard that still hits its limit is a red to fix at its cause, not
  # a limit to raise. The rotation shards (`cold`) run on the job's new iPad, before anything warms it.
  # scripts/ci-shards.py (in `CI scripts, offline`, which `GatefoldCore tests` stands for) fails when a listed test does
  # not exist, runs in two shards, or differs from scripts/ci-shards.expect; each error names the test and the fix
  # (`python3 -I scripts/ci-shards.py write`).
  ipad-place:
    name: iPad place shard (${{ matrix.shard }})
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.app != 'false' }}
    strategy:
      fail-fast: false
      max-parallel: ${{ github.event_name != 'pull_request' && 3 || needs.changes.outputs.full != 'false' && 2 || 10 }}
      matrix:
        include:
          - shard: ipad-place-portrait
            # 299 s median
            tests: >-
              NavigationPlaceUITests/testReadInPortraitRotatedThenLeftKeepsHisFirstWords
            skip: ""
            pr_tests: none
            cold: false
            timeout: 36 # 12 + 2 x 5.8 + 12
          - shard: ipad-place-numbers
            # 303
            tests: >-
              NavigationPlaceUITests/testWithPageNumbersOnReadInPortraitRotatedThenLeftKeepsHisFirstWords
            skip: ""
            pr_tests: none
            cold: false
            timeout: 36 # 12 + 2 x 5.5 + 12
          - shard: ipad-place-loading
            # 264 + 68
            tests: >-
              NavigationPlaceUITests/testAJumpFromAPageStillLoadingStartsAtOnce CountingPlaceholderUITests/testAFreshOpenOnItsSideNeverLeavesTheNumbersSlotBlank
            skip: ""
            pr_tests: none
            cold: false
            timeout: 38 # 12 + 2 x 7.0 + 12
          - shard: ipad-place-jumps
            # 180 + 165
            tests: >-
              NavigationPlaceUITests/testAContentsJumpKeepsThePlace NavigationPlaceUITests/testScrolledAfterTheLaunchReflowThenLeftKeepsWhereHeScrolled
            skip: ""
            pr_tests: none
            cold: false
            timeout: 39 # 12 + 2 x 7.5 + 12
          - shard: ipad-place-shelf
            # 155 + 155
            tests: >-
              NavigationPlaceUITests/testOpenedFromTheShelfThenLeftTwiceWithoutATurnKeepsThePlace PositionUITests/testEveryPostureKeepsThePlace
            skip: ""
            pr_tests: none
            cold: false
            timeout: 39 # 12 + 2 x 7.4 + 12
          - shard: ipad-place-counting
            # The catch-all for new placeholder tests: 85 + 40
            tests: >-
              CountingPlaceholderUITests NavigationPlaceUITests/testTheOpeningCoverLetsTheControlsThrough
            skip: >-
              CountingPlaceholderUITests/testAFreshOpenOnItsSideNeverLeavesTheNumbersSlotBlank
            pr_tests: none
            cold: false
            timeout: 30 # 12 + 2 x 2.8 + 12
          - shard: ipad-place-rest
            # The catch-all for new place tests: 130 + 124 + 94
            tests: >-
              NavigationPlaceUITests
            skip: >-
              NavigationPlaceUITests/testReadInPortraitRotatedThenLeftKeepsHisFirstWords NavigationPlaceUITests/testWithPageNumbersOnReadInPortraitRotatedThenLeftKeepsHisFirstWords NavigationPlaceUITests/testAJumpFromAPageStillLoadingStartsAtOnce NavigationPlaceUITests/testAContentsJumpKeepsThePlace NavigationPlaceUITests/testScrolledAfterTheLaunchReflowThenLeftKeepsWhereHeScrolled NavigationPlaceUITests/testOpenedFromTheShelfThenLeftTwiceWithoutATurnKeepsThePlace NavigationPlaceUITests/testTheOpeningCoverLetsTheControlsThrough
            pr_tests: none
            cold: false
            timeout: 39 # 12 + 2 x 7.2 + 12
          - shard: ipad-rotate-contents
            # Rotation, on this job's new iPad: 204
            tests: >-
              RotationMidTransitionUITests/testTurningDuringAContentsJump
            skip: ""
            pr_tests: none
            cold: true
            timeout: 36 # 12 + 2 x 5.7 + 12
          - shard: ipad-rotate-midturn
            # Rotation: 182 + 160, then on main the rotate-then-leave repro, 545, after the mid-turn tests as #167 runs
            # it. On today's main the repro passes with #176's fix taken out in every order tried (#193), so never give
            # it a shard of its own until #193 is fixed. On a pull request only the mid-turn tests run, unless it
            # touches the reader's place code.
            tests: >-
              RotationMidTransitionUITests RotationRepro/testRotateThenLeaveWithoutTurning
            skip: >-
              RotationMidTransitionUITests/testTurningDuringAContentsJump
            pr_tests: >-
              NavigationPlaceUITests/testAContentsJumpKeepsThePlace
              RotationMidTransitionUITests/testTurningDuringAPageTurn
            # On a pull request: Place kept through a jump and a rotation (#130), on place changes (359 s).
            pr_when: place-jumps
            cold: true
            timeout: 61 # 12 + 2 x 18.1 + 12
          - shard: ipad-rotate-stalled
            # Main only: 427
            tests: >-
              RotationRepro
            skip: >-
              RotationRepro/testRotateThenLeaveWithoutTurning
            pr_tests: none
            cold: true
            timeout: 43 # 12 + 2 x 9.1 + 12
    uses: ./.github/workflows/ui-tests.yml
    with:
      device: "iPad Pro 13-inch"
      sim: gatefold-ipad
      shard: ${{ matrix.shard }}
      tests: ${{ matrix.tests }}
      skip: ${{ matrix.skip }}
      pr_tests: ${{ matrix.pr_tests }}
      pr_when: ${{ matrix.pr_when || '' }}
      fired: ${{ needs.changes.outputs.fired }}
      extra: ${{ needs.changes.outputs.edited-ipad }}
      full: ${{ needs.changes.outputs.full }}
      cold: ${{ matrix.cold }}
      timeout: ${{ matrix.timeout }}

  ipad-undo:
    name: iPad undo shard (${{ matrix.shard }})
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.app != 'false' }}
    strategy:
      fail-fast: false
      max-parallel: ${{ github.event_name != 'pull_request' && 1 || needs.changes.outputs.full != 'false' && 1 || 4 }}
      matrix:
        include:
          - shard: ipad-undo-underway
            # 224 + 98
            tests: >-
              PlaceUndoUITests/testATapWhileAJumpIsUnderWayLandsWhereHeChose PlaceUndoUITests/testATapAboveYourPageClosesItAndKeepsThePage
            skip: ""
            pr_tests: none
            cold: false
            timeout: 38 # 12 + 2 x 6.8 + 12
          - shard: ipad-undo-chapter
            # 173 + 127
            tests: >-
              PlaceUndoUITests/testAChaptersFirstPageTurnsBackByTapAndBySwipe PlaceUndoUITests/testAJumpIsOneTapToUndoWithTheControlsHidden
            skip: ""
            pr_tests: none
            cold: false
            timeout: 37 # 12 + 2 x 6.5 + 12
          - shard: ipad-undo-edge
            # 128 + 110
            tests: >-
              PlaceUndoUITests/testATapAtTheLeftEdgeTurnsBackPromptly PlaceUndoUITests/testATapAtTheLeftEdgeTurnsBackPromptlyWithinAChapter
            skip: ""
            pr_tests: >-
              PlaceUndoUITests/testATouchOnTheScrubberNeverJumps
              PlaceUndoUITests/testAJumpIsOneTapToUndoWithTheControlsHidden
              NavigationPlaceUITests/testTheCloudsOfferOverTheOpeningCoverTakesHisTap
            # On a pull request: Place, no accidental jumps and one-tap undo, on place and launch changes (339 s; the undo test is noisy, #196).
            pr_when: place-undo
            cold: false
            timeout: 34 # 12 + 2 x 4.8 + 12
          - shard: ipad-undo-rest
            # The catch-all for new undo tests: 94, and the spread's left edge
            tests: >-
              PlaceUndoUITests
            skip: >-
              PlaceUndoUITests/testATapWhileAJumpIsUnderWayLandsWhereHeChose PlaceUndoUITests/testATapAboveYourPageClosesItAndKeepsThePage PlaceUndoUITests/testAChaptersFirstPageTurnsBackByTapAndBySwipe PlaceUndoUITests/testAJumpIsOneTapToUndoWithTheControlsHidden PlaceUndoUITests/testATapAtTheLeftEdgeTurnsBackPromptly PlaceUndoUITests/testATapAtTheLeftEdgeTurnsBackPromptlyWithinAChapter
            pr_tests: none
            cold: false
            timeout: 33 # 12 + 2 x 4.4 + 12
    uses: ./.github/workflows/ui-tests.yml
    with:
      device: "iPad Pro 13-inch"
      sim: gatefold-ipad
      shard: ${{ matrix.shard }}
      tests: ${{ matrix.tests }}
      skip: ${{ matrix.skip }}
      pr_tests: ${{ matrix.pr_tests }}
      pr_when: ${{ matrix.pr_when || '' }}
      fired: ${{ needs.changes.outputs.fired }}
      extra: ${{ needs.changes.outputs.edited-ipad }}
      full: ${{ needs.changes.outputs.full }}
      cold: ${{ matrix.cold }}
      timeout: ${{ matrix.timeout }}

  ipad-taps:
    name: iPad taps shard (${{ matrix.shard }})
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.app != 'false' }}
    strategy:
      fail-fast: false
      max-parallel: ${{ github.event_name != 'pull_request' && 2 || needs.changes.outputs.full != 'false' && 1 || 7 }}
      matrix:
        include:
          - shard: ipad-taps-quick
            # 202 + 83
            tests: >-
              FineTuneTapUITests/testAQuickTouchChangesEverySwitchOnce FineTuneTapUITests/testATapOnTheRowsNameChangesItsSwitch
            skip: ""
            pr_tests: >-
              FineTuneTapUITests/testAQuickTouchChangesEverySwitchOnce
              FineTuneTapUITests/testATapOnTheRowsNameChangesItsSwitch
              SpreadTurnSettleUITests/testSpreadTurnsLandWithoutSliding
            # On a pull request: Page and taps: quick touches (#175), a row name, spread turns, on chrome, curl and settings changes (334 s).
            pr_when: taps
            cold: false
            timeout: 41 # 12 + 2 x 8.2 + 12
          - shard: ipad-taps-rest
            # The catch-all for new Fine-Tune tests: 183
            tests: >-
              FineTuneTapUITests
            skip: >-
              FineTuneTapUITests/testAQuickTouchChangesEverySwitchOnce FineTuneTapUITests/testATapOnTheRowsNameChangesItsSwitch FineTuneTapUITests/testEveryTapFlipsJustifyPortrait FineTuneTapUITests/testEveryTapFlipsPageNumbersPortrait FineTuneTapUITests/testEveryTapFlipsPositionLabelPortrait FineTuneTapUITests/testEveryTapFlipsPagesLeftPortrait FineTuneTapUITests/testEveryTapFlipsJustifyLandscape FineTuneTapUITests/testEveryTapFlipsPageNumbersLandscape FineTuneTapUITests/testEveryTapFlipsPositionLabelLandscape FineTuneTapUITests/testEveryTapFlipsPagesLeftLandscape
            pr_tests: none
            cold: false
            timeout: 33 # 12 + 2 x 4.3 + 12
          - shard: ipad-taps-furniture
            # 130 + 129 + 86
            tests: >-
              PageFurnitureUITests
            skip: ""
            pr_tests: none
            cold: false
            timeout: 38 # 12 + 2 x 6.5 + 12
          - shard: ipad-taps-portrait
            # Main only, every tap, one switch each (#200): 168 + 135
            tests: >-
              FineTuneTapUITests/testEveryTapFlipsJustifyPortrait FineTuneTapUITests/testEveryTapFlipsPageNumbersPortrait
            skip: ""
            pr_tests: none
            cold: false
            timeout: 35 # 12 + 2 x 5.1 + 12
          - shard: ipad-taps-portrait-more
            # Main only, every tap (#200): 120 + 129 + 149
            tests: >-
              FineTuneTapUITests/testEveryTapFlipsPositionLabelPortrait FineTuneTapUITests/testEveryTapFlipsPagesLeftPortrait FineTuneTapUITests/testEveryTapFlipsPagesLeftLandscape
            skip: ""
            pr_tests: none
            cold: false
            timeout: 38 # 12 + 2 x 6.6 + 12
          - shard: ipad-taps-landscape
            # Main only, every tap (#200): 295
            tests: >-
              FineTuneTapUITests/testEveryTapFlipsJustifyLandscape
            skip: ""
            pr_tests: none
            cold: false
            timeout: 34 # 12 + 2 x 4.9 + 12
          - shard: ipad-taps-landscape-more
            # Main only, every tap (#200): 165 + 146
            tests: >-
              FineTuneTapUITests/testEveryTapFlipsPageNumbersLandscape FineTuneTapUITests/testEveryTapFlipsPositionLabelLandscape
            skip: ""
            pr_tests: none
            cold: false
            timeout: 35 # 12 + 2 x 5.2 + 12
    uses: ./.github/workflows/ui-tests.yml
    with:
      device: "iPad Pro 13-inch"
      sim: gatefold-ipad
      shard: ${{ matrix.shard }}
      tests: ${{ matrix.tests }}
      skip: ${{ matrix.skip }}
      pr_tests: ${{ matrix.pr_tests }}
      pr_when: ${{ matrix.pr_when || '' }}
      fired: ${{ needs.changes.outputs.fired }}
      extra: ${{ needs.changes.outputs.edited-ipad }}
      full: ${{ needs.changes.outputs.full }}
      cold: ${{ matrix.cold }}
      timeout: ${{ matrix.timeout }}

  ipad-reviewer:
    name: iPad reviewer shard (${{ matrix.shard }})
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.app != 'false' }}
    strategy:
      fail-fast: false
      max-parallel: ${{ github.event_name != 'pull_request' && 3 || needs.changes.outputs.full != 'false' && 2 || 5 }}
      matrix:
        include:
          - shard: ipad-reviewer-smoke
            # The PR smoke: the last page's number is the count (#30), and the reader fits its window: 169 + 80 + 77
            tests: >-
              ReviewerChecksUITests/testTheLastPagesNumberIsTheCount WindowFitUITests
            skip: ""
            pr_tests: >-
              NavigationPlaceUITests/testOpenedFromTheShelfThenLeftTwiceWithoutATurnKeepsThePlace
              PlaceUndoUITests/testATapAtTheLeftEdgeTurnsBackPromptly
            # On a pull request: iPad smoke, on every app change: open, leave and reopen on his page; a tap turns back (285 s).
            pr_when: smoke
            cold: false
            timeout: 39 # 12 + 2 x 7.3 + 12
          - shard: ipad-reviewer-controls
            # Main only: 1481
            tests: >-
              ReopenAfterControlsUITests
            skip: ""
            pr_tests: none
            cold: false
            timeout: 90 # 12 + 2 x 32.8 + 12
          - shard: ipad-reviewer-numbers
            # Main only: 926
            tests: >-
              ReviewerChecksUITests/testPageNumbersAreOnOrOffInEveryBook
            skip: ""
            pr_tests: none
            cold: false
            timeout: 66 # 12 + 2 x 20.6 + 12
          - shard: ipad-reviewer-spread
            # Main only: 358 + 99
            tests: >-
              PageNumberUITests/testOnASpreadEveryTurnMovesOnTwoPages SpreadTurnSettleUITests/testSpreadTurnsLandWithoutSliding
            skip: ""
            pr_tests: none
            cold: false
            timeout: 48 # 12 + 2 x 12.0 + 12
          - shard: ipad-reviewer-rest
            # Main only, the catch-all for new reviewer checks: 842 + 88
            tests: >-
              ReviewerChecksUITests
            skip: >-
              ReviewerChecksUITests/testTheLastPagesNumberIsTheCount ReviewerChecksUITests/testPageNumbersAreOnOrOffInEveryBook
            pr_tests: none
            cold: false
            timeout: 74 # 12 + 2 x 24.8 + 12
    uses: ./.github/workflows/ui-tests.yml
    with:
      device: "iPad Pro 13-inch"
      sim: gatefold-ipad
      shard: ${{ matrix.shard }}
      tests: ${{ matrix.tests }}
      skip: ${{ matrix.skip }}
      pr_tests: ${{ matrix.pr_tests }}
      pr_when: ${{ matrix.pr_when || '' }}
      fired: ${{ needs.changes.outputs.fired }}
      extra: ${{ needs.changes.outputs.edited-ipad }}
      full: ${{ needs.changes.outputs.full }}
      cold: ${{ matrix.cold }}
      # A smoke shard that also runs the classes this pull request edits gets 90 min, whatever their length.
      timeout: ${{ matrix.pr_when == 'smoke' && needs.changes.outputs.edited-ipad != '' && 90 || matrix.timeout }}

  duo:
    name: Duo shard (${{ matrix.shard }})
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.app != 'false' }}
    strategy:
      fail-fast: false
      max-parallel: ${{ github.event_name != 'pull_request' && 3 || needs.changes.outputs.full != 'false' && 2 || 9 }}
      matrix:
        include:
          - shard: duo-taps-portrait
            # Every tap, alone: 374
            tests: >-
              FineTuneTapUITests/testEveryTapFlipsJustifyPortrait FineTuneTapUITests/testEveryTapFlipsPageNumbersPortrait FineTuneTapUITests/testEveryTapFlipsPositionLabelPortrait FineTuneTapUITests/testEveryTapFlipsPagesLeftPortrait
            skip: ""
            pr_tests: none
            cold: false
            timeout: 40 # 12 + 2 x 7.7 + 12
          - shard: duo-taps-quick
            # 176 + 64
            tests: >-
              FineTuneTapUITests/testAQuickTouchChangesEverySwitchOnce FineTuneTapUITests/testATapOnTheRowsNameChangesItsSwitch
            skip: ""
            pr_tests: none
            cold: false
            timeout: 35 # 12 + 2 x 5.3 + 12
          - shard: duo-taps-rest
            # The catch-all for new Fine-Tune tests: 133, and the landscape every-tap test, which skips on the Duo
            tests: >-
              FineTuneTapUITests
            skip: >-
              FineTuneTapUITests/testEveryTapFlipsJustifyPortrait FineTuneTapUITests/testEveryTapFlipsPageNumbersPortrait FineTuneTapUITests/testEveryTapFlipsPositionLabelPortrait FineTuneTapUITests/testEveryTapFlipsPagesLeftPortrait FineTuneTapUITests/testAQuickTouchChangesEverySwitchOnce FineTuneTapUITests/testATapOnTheRowsNameChangesItsSwitch
            pr_tests: none
            cold: false
            timeout: 34 # 12 + 2 x 4.5 + 12
          - shard: duo-position
            # 151 + 137
            tests: >-
              PositionUITests/testTabletopDeckTurnsAndResizes PositionUITests/testFontChangeKeepsThePlace
            skip: ""
            pr_tests: none
            cold: false
            timeout: 39 # 12 + 2 x 7.0 + 12
          - shard: duo-position-rest
            # The catch-all for new position tests: 66, rotation and posture
            tests: >-
              PositionUITests
            skip: >-
              PositionUITests/testTabletopDeckTurnsAndResizes PositionUITests/testFontChangeKeepsThePlace
            pr_tests: none
            cold: false
            timeout: 35 # 12 + 2 x 5.5 + 12
          - shard: duo-pagenumber
            # A page a turn, and a reopen keeps the numbers: 295
            tests: >-
              PageNumberUITests/testEveryTurnMovesOnAPageAndAReopenKeepsTheNumbers
            skip: ""
            pr_tests: >-
              PageNumberUITests/testEveryTurnMovesOnAPageAndAReopenKeepsTheNumbers
              PlaceUndoUITests/testATapAtTheLeftEdgeTurnsBackPromptly
            # On a pull request: Duo smoke, on every app change: turns, a reopen keeps the numbers, a tap turns back (358 s).
            pr_when: smoke
            cold: false
            timeout: 39 # 12 + 2 x 7.3 + 12
          - shard: duo-turnback
            # The folded Duo's turn checks (#61): within 12 reads and 24 looks, a TURNWAIT line each: 120 + 99
            tests: >-
              PlaceUndoUITests/testATapAtTheLeftEdgeTurnsBackPromptly PlaceUndoUITests/testATapAtTheLeftEdgeTurnsBackPromptlyWithinAChapter
            skip: ""
            pr_tests: none
            cold: false
            timeout: 34 # 12 + 2 x 4.9 + 12
          - shard: duo-reviewer-reopen
            # Main only: 791
            tests: >-
              ReviewerChecksUITests/testEveryReopenReturnsTheSameWords
            skip: ""
            pr_tests: none
            cold: false
            timeout: 67 # 12 + 2 x 21.4 + 12
          - shard: duo-reviewer-rest
            # Main only, the catch-all for new reviewer checks: 964 + 204 (the default spread skips on the Duo)
            tests: >-
              ReviewerChecksUITests
            skip: >-
              ReviewerChecksUITests/testEveryReopenReturnsTheSameWords
            pr_tests: none
            cold: false
            timeout: 71 # 12 + 2 x 23.2 + 12
    uses: ./.github/workflows/ui-tests.yml
    with:
      device: "iPhone Duo"
      sim: gatefold-duo
      shard: ${{ matrix.shard }}
      tests: ${{ matrix.tests }}
      skip: ${{ matrix.skip }}
      pr_tests: ${{ matrix.pr_tests }}
      pr_when: ${{ matrix.pr_when || '' }}
      fired: ${{ needs.changes.outputs.fired }}
      extra: ${{ needs.changes.outputs.edited-duo }}
      full: ${{ needs.changes.outputs.full }}
      cold: ${{ matrix.cold }}
      # A smoke shard that also runs the classes this pull request edits gets 90 min, whatever their length.
      timeout: ${{ matrix.pr_when == 'smoke' && needs.changes.outputs.edited-duo != '' && 90 || matrix.timeout }}

  ipad-place-gate:
    # The required check for the iPad's place: green when every shard passed, or when only Markdown changed (gatefold#42).
    # Always runs, so the check reports on every pull request; a failed or cancelled shard turns it red.
    name: iPad (place)
    needs: [changes, ipad-place]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          APP: ${{ needs.changes.outputs.app }}
          SHARDS: ${{ needs.ipad-place.result }}
        run: |
          if [ "$APP" = false ]; then echo "Only Markdown changed; nothing to test."; exit 0; fi
          echo "Shards: $SHARDS"
          [ "$SHARDS" = success ]

