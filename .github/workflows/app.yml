name: App

# Probe for gatefold#198 (never merged): where does `simctl boot --disabledJob` land on iOS 27, and does a job named
# in its own domain (user/foreground) stay off? No app, no tests, no book text.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  where:
    name: The bootstrap plist with --disabledJob, plain and domain-qualified (${{ matrix.form }})
    runs-on: xcode-27
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        form: [plain, user-foreground, gui]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/select-xcode
      - env:
          FORM: ${{ matrix.form }}
        run: |
          set -u
          read -r rt dt < <(.github/probe/sim.sh pick)
          case "$FORM" in plain) p="";; user-foreground) p="user/foreground/";; gui) p="gui/501/";; esac
          args=(); for j in com.apple.homed com.apple.geod com.apple.weatherd com.apple.triald com.apple.PosterBoard; do args+=("--disabledJob=$p$j"); done
          u=$(xcrun simctl create probe-ipad "$dt" "$rt")
          xcrun simctl boot "$u" "${args[@]}"; echo "boot exit $?"
          d="$HOME/Library/Developer/CoreSimulator/Devices/$u/data"
          sleep 20
          f="$d/var/run/launchd_bootstrap.plist"; ls -la "$f"
          plutil -p "$f" | grep -n -i -E "homed|geod|weatherd|triald|PosterBoard|disab" | head -30
          plutil -p "$f" | head -60
          xcrun simctl bootstatus "$u" -b >/dev/null 2>&1; echo "bootstatus $?"
          for dom in system user/501 user/foreground gui/501; do echo "-- $dom"; xcrun simctl spawn "$u" launchctl print-disabled "$dom" 2>&1 | head -12; done
          xcrun simctl spawn "$u" launchctl list | grep -E "homed|geod|weatherd|triald|PosterBoard"
          xcrun simctl spawn "$u" launchctl print user/foreground/com.apple.homed 2>&1 | head -20
