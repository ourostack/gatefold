name: App

# Two tiers. Every pull request runs the seven required checks: the place, taps and unit legs in full, and a smoke of
# the reviewers' checks (the last page's number, #30; the window fit; a Duo turn-and-reopen). Every push to main runs
# the reviewers' full lists. A red main is fixed by whoever merged the change that turned it red (AGENTS.md, "CI").
#
# Build once: `build` makes the app and its tests for the simulator (build-for-testing) and uploads them, named by
# commit and Xcode version; every simulator job boots its simulator while it downloads them and runs
# test-without-building, so no job compiles the app again (gatefold#39: each job spent 10 to 16 min building).
#
# A pull request that changes only Markdown still gets every required check: `changes` says so, the jobs below skip,
# and `ipad-docs` reports the three iPad checks (a skipped matrix job reports under its unexpanded name; gatefold#42).
# The jobs run unless `changes` said "only Markdown", and a failed `build` turns them red at the download instead of
# letting them skip, which would count as a pass. A failed `changes` leaves `full` empty, which runs the full lists.
#
# A pull request that edits a test in the full lists, or the CI that runs them, runs the full lists too.

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

# A newer push to a pull request cancels its older run. Pushes to main keep one group per commit and are never
# cancelled.
concurrency:
  group: app-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: What this change touches
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.diff.outputs.app }}
      full: ${{ steps.diff.outputs.full }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          if [ "$EVENT" != pull_request ]; then printf 'app=true\nfull=true\n' >> "$GITHUB_OUTPUT"; exit 0; fi
          git diff --name-only "$BASE...$HEAD" > changed.txt
          cat changed.txt
          if grep -qE '^(GatefoldUITests/(ReviewerChecks|PageNumber|SpreadTurnSettle|ReopenAfterControls|WindowFit)UITests\.swift|\.github/(workflows/app\.yml|scripts/boot-sim\.sh|actions/)|scripts/ci-simulator\.py)$|^\.github/actions/' changed.txt; then
            echo "::notice::This change edits a full-list test or the CI that runs it: the full lists run."
            echo "full=true" >> "$GITHUB_OUTPUT"
          else
            echo "full=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -qv '\.md$' changed.txt; then echo "app=true" >> "$GITHUB_OUTPUT"; else
            echo "::notice::Only Markdown changed: the app checks report success without running."
            echo "app=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build for testing
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.app != 'false' }}
    runs-on: xcode-27
    timeout-minutes: 35
    outputs:
      artifact: ${{ steps.name.outputs.artifact }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/select-xcode
      - id: name
        name: Name the build by commit and Xcode version
        run: echo "artifact=gatefold-tests-${{ github.sha }}-xcode-$(xcodebuild -version | tr -s ' \n' '-' | sed 's/-$//; s/^Xcode-//; s/-Build-version-/-/')" >> "$GITHUB_OUTPUT"
      - name: Install the Metal toolchain (the page curl is a Metal shader)
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Generate the Xcode project from project.yml
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate
      - name: Build the app and its tests for the simulator, once
        # About 13 to 16 min measured in each job that used to build (gatefold#39).
        timeout-minutes: 25
        run: |
          set -o pipefail
          xcodebuild build-for-testing -project Gatefold.xcodeproj -scheme Gatefold \
            -destination 'generic/platform=iOS Simulator' ARCHS="$(uname -m)" \
            -derivedDataPath "$RUNNER_TEMP/dd" 2>&1 | tee "$RUNNER_TEMP/build.log" | tail -60
          ls "$RUNNER_TEMP"/dd/Build/Products/*.xctestrun
          tar -czf "$RUNNER_TEMP/products.tgz" -C "$RUNNER_TEMP/dd/Build" Products
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.artifact }}
          path: ${{ runner.temp }}/products.tgz
          # Long enough for "Re-run failed jobs" a few days later.
          retention-days: 5
          compression-level: 0
          overwrite: true
      - uses: actions/upload-artifact@v4
        if: failure() || cancelled()
        with:
          name: build-log
          path: ${{ runner.temp }}/build.log
          overwrite: true

  core:
    name: GatefoldCore tests
    # GatefoldCore is pure Swift (Foundation only, no UIKit or Readium), so it tests on Linux and
    # spends no macOS minutes. The app's build still compiles it against the iOS 27 SDK below.
    # In Swift's own image: the Ubuntu 26.04 runner image stopped carrying Swift (exit 127 on
    # `swift --version`, 2026-11-05).
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.app != 'false' }}
    runs-on: ubuntu-latest
    container: swift:6.2
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: swift test
        run: swift test --package-path Packages/GatefoldCore

  ipad:
    name: iPad (${{ matrix.name }})
    # The spread on rotation and the iPad's slow launch reflow are iPad paths: a rotation that
    # reopened a page early (build 17) and a jump lost in the launch reflow. No retry: a red here is
    # a real miss. The Duo job's posture test skips on the folded cover; this one runs it on a spread.
    # Three jobs side by side, each with at least 30% headroom (one job took 94 of 100 min in build
    # 19). Measured on a hosted runner: about 13 min to set up and build, then the tests' own time.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: place
            # 48 min measured with the erased-iPad rotation at 23; it has taken 38, so 63 / 0.7.
            timeout: 90
            # Rotation first, on an erased iPad (the cold step), then the rest on the same one.
            cold: true
            title: Jumps keep his place; the number's slot is never blank
            tests: >-
              NavigationPlaceUITests PositionUITests/testEveryPostureKeepsThePlace
              CountingPlaceholderUITests PlaceUndoUITests
          - name: taps
            # 53 min measured (a 10 min simulator boot among them); measured / 0.7 keeps 30% headroom.
            timeout: 80
            title: Every Fine-Tune tap lands; the furniture never moves the words
            tests: FineTuneTapUITests PageFurnitureUITests
          - name: reviewer
            # 65 min measured with the full list; measured / 0.7 keeps 30% headroom.
            timeout: 95
            title: The reviewers' checks - reopen by hash, true numbers, reader-wide toggles, density, landing; the reader fits its window
            # Pushes to main run the whole list.
            tests: >-
              ReviewerChecksUITests PageNumberUITests/testOnASpreadEveryTurnMovesOnTwoPages
              SpreadTurnSettleUITests/testSpreadTurnsLandWithoutSliding
              ReopenAfterControlsUITests WindowFitUITests
            # Pull requests run its smoke: the last page's number is the count (#30), and the reader fits its window.
            pr_tests: >-
              ReviewerChecksUITests/testTheLastPagesNumberIsTheCount WindowFitUITests
    needs: [changes, build]
    if: ${{ !cancelled() && needs.changes.outputs.app != 'false' }}
    runs-on: xcode-27
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/select-xcode
      - name: Start an iPad Pro 13-inch booting
        run: python3 -I scripts/ci-simulator.py start gatefold-ipad "iPad Pro 13-inch"
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: ${{ runner.temp }}
      - name: Unpack the app and its tests (built once, for this commit and Xcode)
        id: unpack
        env:
          ARTIFACT: ${{ needs.build.outputs.artifact }}
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/dd/Build"
          tar -xzf "$RUNNER_TEMP/products.tgz" -C "$RUNNER_TEMP/dd/Build"
          # The build is keyed by commit and Xcode version and build; this job must have selected the same Xcode.
          want="gatefold-tests-$GITHUB_SHA-xcode-$(xcodebuild -version | tr -s ' \n' '-' | sed 's/-$//; s/^Xcode-//; s/-Build-version-/-/')"
          [ "$want" = "$ARTIFACT" ] || { echo "::error::Built as $ARTIFACT, but this job's Xcode makes $want"; exit 1; }
          echo "XCTESTRUN=$(ls "$RUNNER_TEMP"/dd/Build/Products/*.xctestrun | head -1)" >> "$GITHUB_ENV"
      - name: The iPad finished booting
        id: boot
        # boot-sim.sh retries a boot that fails or hangs (#57); this step waits for it with a limit.
        timeout-minutes: 22
        run: python3 -I scripts/ci-simulator.py wait gatefold-ipad "iPad Pro 13-inch" 1200
      - name: Keep the app's place log as it runs (file and progression only, never the book's words)
        run: |
          nohup sh -c 'xcrun simctl spawn "$0" log stream --style compact --predicate "subsystem == \"bot.ouro.gatefold\"" 2>/dev/null \
            | grep --line-buffered -E "place (read|write)|place:|location |reflow|landing|landed|reopen|tapped|warm:|open:|first page|pages:|turn:|spread:|veil:|settle [0-9]|snapshot:" \
            | grep --line-buffered -v -E "text:|\] visible|anchor" >> "$1"' "$UDID" "$RUNNER_TEMP/place.log" >/dev/null 2>&1 &
      - name: Turned on its side cold (an erased iPad), the spread always comes whole and keeps his place
        # An erased simulator, not a new one: build 19 left the old page under a frozen leaf in 3 of 9
        # rounds after an erase and 0 of 3 on a new simulator. Once a run, before anything warms it.
        if: matrix.cold
        # 36 and 38 min on a hosted runner (16-17 to build, the rest tests; build 20), so 55 keeps 30%
        # headroom. A runner once hung here past 90 min with nothing in the log, so the step is bounded
        # and reports each test as it ends.
        timeout-minutes: 55
        env:
          # The runner draws the spread two to four times slower than a Mac (up to 50 s seen): 90 s
          # still fails a page left stuck for good.
          TEST_RUNNER_GATEFOLD_SPREAD_FLOOR: "90"
        run: |
          udid="$UDID"
          echo "$(date -u +%T) erasing $udid"
          xcrun simctl shutdown "$udid"
          xcrun simctl erase "$udid"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          # The erase ended the place log's stream; take it up again.
          nohup sh -c 'xcrun simctl spawn "$0" log stream --style compact --predicate "subsystem == \"bot.ouro.gatefold\"" 2>/dev/null \
            | grep --line-buffered -E "place (read|write)|place:|location |reflow|landing|landed|reopen|tapped|warm:|open:|first page|pages:|turn:|spread:|veil:|settle [0-9]|REPRO|snapshot:" \
            | grep --line-buffered -v -E "text:|\] visible|anchor" >> "$1"' "$udid" "$RUNNER_TEMP/place.log" >/dev/null 2>&1 &
          echo "$(date -u +%T) booted; testing"
          xcodebuild test-without-building -xctestrun "$XCTESTRUN" \
            -destination "$DESTINATION" \
            -only-testing:GatefoldUITests/RotationRepro \
            -only-testing:GatefoldUITests/RotationMidTransitionUITests \
            -resultBundlePath "$RUNNER_TEMP/cold.xcresult" 2>&1 | tee "$RUNNER_TEMP/cold.log" \
            | grep --line-buffered -E "Test Case .*(started|passed|failed|skipped)|TEST (SUCCEEDED|FAILED)|REPRO (setup|jump|round|SUMMARY)|MIDTURN|\.swift:[0-9]+: error" \
            | awk '{ if (match($0, /XCTAssert[A-Za-z]* failed/)) $0 = substr($0, 1, RSTART + RLENGTH - 1) " (text withheld)"; print; fflush() }'
          status=${PIPESTATUS[0]}
          echo "$(date -u +%T) done ($status)"
          exit $status
      - name: ${{ matrix.title }}
        # A miss in the cold step still lets the rest report: one failure must not hide the others.
        # Not without the app or a booted iPad, which would only add a misleading red.
        if: ${{ !cancelled() && steps.unpack.outcome == 'success' && steps.boot.outcome == 'success' }}
        env:
          TESTS: ${{ needs.changes.outputs.full != 'false' && matrix.tests || matrix.pr_tests || matrix.tests }}
          # Five rounds of the controls-then-numbers reopen (about 2 min each); 30 locally.
          TEST_RUNNER_GATEFOLD_REOPEN_ROUNDS: "5"
        run: |
          set -o pipefail
          only=()
          for t in $TESTS; do only+=("-only-testing:GatefoldUITests/$t"); done
          # Each test's result prints as it finishes: a job cut off at its limit still names the slow test
          # (run 42393941976's reviewer leg printed nothing, since this read the log only at the end).
          xcodebuild test-without-building -xctestrun "$XCTESTRUN" \
            -destination "$DESTINATION" "${only[@]}" \
            -resultBundlePath "$RUNNER_TEMP/ipad.xcresult" 2>&1 | tee "$RUNNER_TEMP/ipad.log" \
            | grep --line-buffered -E "Test Case .*(started|passed|failed|skipped)|TEST (SUCCEEDED|FAILED)|REPRO (round|SUMMARY)|TAPRATE|PLACEHOLDER|REVIEWER|OLDPAGEHELD|WINDOWFIT|REOPEN round [0-9]+:|\.swift:[0-9]+: error" \
            | awk '{ if (match($0, /XCTAssert[A-Za-z]* failed/)) $0 = substr($0, 1, RSTART + RLENGTH - 1) " (text withheld)"; print; fflush() }'
          exit ${PIPESTATUS[0]}
      - name: The app's place log, for a miss (file and progression only, never the book's words)
        if: failure() || cancelled()
        # Kept as the job ran (a `log show` over hours of a busy simulator took 23 min and ran the job
        # out of time, losing every log), so here it is only closed off.
        timeout-minutes: 2
        run: |
          pkill -f "log stream --style compact" || true
          wc -l < "$RUNNER_TEMP/place.log" || true
      - uses: actions/upload-artifact@v4
        if: failure() || cancelled()
        with:
          name: ipad-${{ matrix.name }}-results
          path: |
            ${{ runner.temp }}/place.log
            ${{ runner.temp }}/cold.log
            ${{ runner.temp }}/cold.xcresult
            ${{ runner.temp }}/ipad.log
            ${{ runner.temp }}/ipad.xcresult

  app:
    name: Build and unit-test the app
    # xcode-27 is the only hosted image with Xcode 27.1: the first SDK with the iPhone Duo fold
    # APIs, the iOS 27 deployment target and the iPhone Duo simulator. macos-latest (macOS 26) has
    # only Xcode 26, so this job cannot move there.
    # ~55 min in build 19: 85 keeps 30% headroom.
    needs: [changes, build]
    if: ${{ !cancelled() && needs.changes.outputs.app != 'false' }}
    runs-on: xcode-27
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/select-xcode
      - name: Start an iPhone Duo booting
        run: python3 -I scripts/ci-simulator.py start gatefold-duo "iPhone Duo"
      # The device build runs while the Duo boots. A boot retry restarts CoreSimulatorService, which this generic
      # device build does not use for a destination; retries are rare (#57), so the overlap is worth it.
      - name: Install the Metal toolchain (the page curl is a Metal shader)
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Generate the Xcode project from project.yml
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate
      - name: Release build for devices (the same binary runs on the Mac as Designed for iPad)
        run: |
          set -o pipefail
          xcodebuild build -project Gatefold.xcodeproj -scheme Gatefold -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/release" CODE_SIGNING_ALLOWED=NO 2>&1 | tail -50
      - name: The shipped app can't move his place by itself (test-only launch jumps are compiled out)
        run: |
          binary="$RUNNER_TEMP/release/Build/Products/Release-iphoneos/Gatefold.app/Gatefold"
          test -f "$binary"
          # Swift keeps literals of 15 bytes or fewer inline, where strings can't see them, so the check
          # looks for the launch jump's 34-byte marker (LaunchOptions.goToMarker), whose prefix is the key.
          marker="GatefoldGoTo/test-only-launch-jump"
          if ! grep -q "\"$marker\"" Gatefold/Design/Design.swift; then
            echo "::error::LaunchOptions.goToMarker no longer reads $marker; update this check with it"
            exit 1
          fi
          # The key itself is too short for strings to see, so the app may only read it through the marker.
          if git grep -n '"GatefoldGoTo"' -- Gatefold; then
            echo "::error::The app reads GatefoldGoTo directly, where this check can't see it; read it through LaunchOptions.goToMarker"
            exit 1
          fi
          # Canary: a launch key of 16 bytes that Release keeps must be visible, or a miss proves nothing.
          if ! strings -a "$binary" | grep -q "GatefoldOpenBook"; then
            echo "::error::This check can't see the Release app's launch keys, so it can't vouch for it"
            exit 1
          fi
          if strings -a "$binary" | grep -q "$marker"; then
            echo "::error::The Release app reads -GatefoldGoTo: a launch jump could move his place"
            exit 1
          fi
          echo "No launch jump in the Release app"
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: ${{ runner.temp }}
      - name: Unpack the app and its tests (built once, for this commit and Xcode)
        env:
          ARTIFACT: ${{ needs.build.outputs.artifact }}
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/dd/Build"
          tar -xzf "$RUNNER_TEMP/products.tgz" -C "$RUNNER_TEMP/dd/Build"
          # The build is keyed by commit and Xcode version and build; this job must have selected the same Xcode.
          want="gatefold-tests-$GITHUB_SHA-xcode-$(xcodebuild -version | tr -s ' \n' '-' | sed 's/-$//; s/^Xcode-//; s/-Build-version-/-/')"
          [ "$want" = "$ARTIFACT" ] || { echo "::error::Built as $ARTIFACT, but this job's Xcode makes $want"; exit 1; }
          echo "XCTESTRUN=$(ls "$RUNNER_TEMP"/dd/Build/Products/*.xctestrun | head -1)" >> "$GITHUB_ENV"
      - name: The iPhone Duo finished booting
        timeout-minutes: 22
        run: python3 -I scripts/ci-simulator.py wait gatefold-duo "iPhone Duo" 1200
      - name: Unit tests
        run: |
          set -o pipefail
          xcodebuild test-without-building -xctestrun "$XCTESTRUN" \
            -destination "$DESTINATION" \
            -only-testing:GatefoldTests \
            -resultBundlePath "$RUNNER_TEMP/unit.xcresult" 2>&1 | tail -200
      - name: Reading position survives posture and font changes; every Fine-Tune tap lands (UI tests)
        run: |
          set -o pipefail
          xcodebuild test-without-building -xctestrun "$XCTESTRUN" \
            -destination "$DESTINATION" \
            -only-testing:GatefoldUITests/PositionUITests \
            -only-testing:GatefoldUITests/FineTuneTapUITests \
            -resultBundlePath "$RUNNER_TEMP/ui.xcresult" > "$RUNNER_TEMP/ui.log" 2>&1 || status=$?
          # No retry: a wait that runs out prints how many probe reads it made and the slowest one.
          grep -E "error:|Test Case .*(passed|failed|skipped)|TEST (SUCCEEDED|FAILED)|probe says|probe timing|TAPRATE" "$RUNNER_TEMP/ui.log" | tail -60 || true
          exit ${status:-0}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: xcresults
          path: |
            ${{ runner.temp }}/unit.xcresult
            ${{ runner.temp }}/ui.xcresult
            ${{ runner.temp }}/ui.log

  duo-reviewer:
    name: Duo (the reviewers' checks)
    # The reviewers' standing checks on the Duo: reopen by hash, true numbers and reader-wide toggles
    # (density is the iPad's), and a page a turn with a reopen keeping its numbers. Then the folded
    # Duo's turn checks (#61), on pull requests too: a tap at either edge turns within 12 reads and
    # 24 looks, with a TURNWAIT line of counts for each.
    # Pull requests run its smoke (a page a turn, and a reopen keeps the numbers); pushes to main add the reviewers'
    # full list, about 13 min a test on this runner (gatefold#39).
    needs: [changes, build]
    if: ${{ !cancelled() && needs.changes.outputs.app != 'false' }}
    runs-on: xcode-27
    # 45 min measured (build 20), plus about 10 for the two turn checks: 85 keeps over 30% headroom.
    # feel-ci sets this job longer (gatefold#65 tracks the overrun): at a merge, the larger value wins.
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/select-xcode
      - name: Start an iPhone Duo booting
        run: python3 -I scripts/ci-simulator.py start gatefold-duo "iPhone Duo"
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: ${{ runner.temp }}
      - name: Unpack the app and its tests (built once, for this commit and Xcode)
        env:
          ARTIFACT: ${{ needs.build.outputs.artifact }}
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/dd/Build"
          tar -xzf "$RUNNER_TEMP/products.tgz" -C "$RUNNER_TEMP/dd/Build"
          # The build is keyed by commit and Xcode version and build; this job must have selected the same Xcode.
          want="gatefold-tests-$GITHUB_SHA-xcode-$(xcodebuild -version | tr -s ' \n' '-' | sed 's/-$//; s/^Xcode-//; s/-Build-version-/-/')"
          [ "$want" = "$ARTIFACT" ] || { echo "::error::Built as $ARTIFACT, but this job's Xcode makes $want"; exit 1; }
          echo "XCTESTRUN=$(ls "$RUNNER_TEMP"/dd/Build/Products/*.xctestrun | head -1)" >> "$GITHUB_ENV"
      - name: The iPhone Duo finished booting
        timeout-minutes: 22
        run: python3 -I scripts/ci-simulator.py wait gatefold-duo "iPhone Duo" 1200
      - name: Keep the app's place log as it runs (file and progression only, never the book's words)
        run: |
          nohup sh -c 'xcrun simctl spawn "$0" log stream --style compact --predicate "subsystem == \"bot.ouro.gatefold\"" 2>/dev/null \
            | grep --line-buffered -E "place (read|write)|place:|location |reflow|landing|landed|reopen|tapped|warm:|open:|first page|pages:|turn:|spread:|veil:|settle [0-9]|snapshot:" \
            | grep --line-buffered -v -E "text:|\] visible|anchor" >> "$1"' "$UDID" "$RUNNER_TEMP/place.log" >/dev/null 2>&1 &
      - name: The reviewers' checks on the Duo
        env:
          FULL: ${{ needs.changes.outputs.full }}
        run: |
          set -o pipefail
          only=(-only-testing:GatefoldUITests/PageNumberUITests/testEveryTurnMovesOnAPageAndAReopenKeepsTheNumbers
            -only-testing:GatefoldUITests/PlaceUndoUITests/testATapAtTheLeftEdgeTurnsBackPromptly
            -only-testing:GatefoldUITests/PlaceUndoUITests/testATapAtTheLeftEdgeTurnsBackPromptlyWithinAChapter)
          if [ "$FULL" != false ]; then only+=(-only-testing:GatefoldUITests/ReviewerChecksUITests); fi
          xcodebuild test-without-building -xctestrun "$XCTESTRUN" \
            -destination "$DESTINATION" "${only[@]}" \
            -resultBundlePath "$RUNNER_TEMP/duo.xcresult" 2>&1 | tee "$RUNNER_TEMP/duo.log" \
            | grep --line-buffered -E "Test Case .*(started|passed|failed|skipped)|TEST (SUCCEEDED|FAILED)|REVIEWER|TURNWAIT|\.swift:[0-9]+: error" \
            | awk '{ if (match($0, /XCTAssert[A-Za-z]* failed/)) $0 = substr($0, 1, RSTART + RLENGTH - 1) " (text withheld)"; print; fflush() }'
          exit ${PIPESTATUS[0]}
      - name: The app's place log, for a miss (file and progression only, never the book's words)
        if: failure() || cancelled()
        # Kept as the job ran (a `log show` over hours of a busy simulator took 23 min and ran the job
        # out of time, losing every log), so here it is only closed off.
        timeout-minutes: 2
        run: |
          pkill -f "log stream --style compact" || true
          wc -l < "$RUNNER_TEMP/place.log" || true
      - uses: actions/upload-artifact@v4
        if: failure() || cancelled()
        with:
          name: duo-reviewer-results
          path: |
            ${{ runner.temp }}/place.log
            ${{ runner.temp }}/duo.log
            ${{ runner.temp }}/duo.xcresult

  ipad-docs:
    # A skipped matrix job reports under its unexpanded name, so a Markdown-only pull request gets the three iPad checks
    # from here instead (gatefold#42). It runs only when `changes` found nothing but Markdown.
    name: iPad (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.app != 'true'
    strategy:
      matrix:
        name: [place, taps, reviewer]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "Only Markdown changed; nothing on the iPad to test."
