name: App

# Two tiers. Every pull request runs the seven required checks: the place, taps and unit legs in full, and a smoke of
# the reviewers' checks (the last page's number, #30; the window fit; a Duo turn-and-reopen). Every push to main runs
# the reviewers' full lists. A red main is fixed by whoever merged the change that turned it red (AGENTS.md, "CI").
#
# Build once: `build` makes the app and its tests for the simulator (build-for-testing) and uploads them, named by
# commit and Xcode version; every simulator job boots its simulator while it downloads them and runs
# test-without-building, so no job compiles the app again (gatefold#39: each job spent 10 to 16 min building).
#
# UI tests run in shards (.github/workflows/ui-tests.yml), each on its own runner, so a pull request's checks fit the
# PR clock (gatefold#39); a gate job named for each required check is green only when all of its shards passed.
#
# A pull request that changes only Markdown still gets every required check: `changes` says so, the test shards skip,
# and each gate job (`iPad (...)`, `Duo (the reviewers' checks)`, `Build and unit-test the app`) reports success
# (gatefold#42).
# The jobs run unless `changes` said "only Markdown", and a failed `build` turns them red at the download instead of
# letting them skip, which would count as a pass. A failed `changes` leaves `full` empty, which runs the full lists.
#
# A pull request that edits a test in the full lists, or the CI that runs them, runs the full lists too.

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

# A newer push to a pull request cancels its older run. Pushes to main keep one group per commit and are never
# cancelled.
concurrency:
  group: app-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: What this change touches
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.diff.outputs.app }}
      full: ${{ steps.diff.outputs.full }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          if [ "$EVENT" != pull_request ]; then printf 'app=true\nfull=true\n' >> "$GITHUB_OUTPUT"; exit 0; fi
          git diff --name-only "$BASE...$HEAD" > changed.txt
          cat changed.txt
          if grep -qE '^(GatefoldUITests/(ReviewerChecks|PageNumber|SpreadTurnSettle|ReopenAfterControls|WindowFit)UITests\.swift|\.github/(workflows/(app|ui-tests)\.yml|scripts/boot-sim\.sh|actions/)|scripts/ci-simulator\.py)$|^\.github/actions/' changed.txt; then
            echo "::notice::This change edits a full-list test or the CI that runs it: the full lists run."
            echo "full=true" >> "$GITHUB_OUTPUT"
          else
            echo "full=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -qv '\.md$' changed.txt; then echo "app=true" >> "$GITHUB_OUTPUT"; else
            echo "::notice::Only Markdown changed: the app checks report success without running."
            echo "app=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build for testing
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.app != 'false' }}
    runs-on: xcode-27
    timeout-minutes: 35
    outputs:
      artifact: ${{ steps.name.outputs.artifact }}
    steps:
      - uses: actions/checkout@v4
      # Here, not in `changes` (not required): a red build turns every required check red.
      - name: The simulator boot and wait logic passes its selftest (#78)
        run: python3 -I scripts/ci-simulator.py --selftest
      - uses: ./.github/actions/select-xcode
      - name: The test-step stopper passes its selftest (#126)
        run: python3 -I scripts/ci-within.py --selftest
      - id: name
        name: Name the build by commit and Xcode version
        run: echo "artifact=gatefold-tests-${{ github.sha }}-xcode-$(xcodebuild -version | tr -s ' \n' '-' | sed 's/-$//; s/^Xcode-//; s/-Build-version-/-/')" >> "$GITHUB_OUTPUT"
      - name: Install the Metal toolchain (the page curl is a Metal shader)
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Generate the Xcode project from project.yml
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate
      - name: Build the app and its tests for the simulator, once
        # About 13 to 16 min measured in each job that used to build (gatefold#39).
        timeout-minutes: 25
        run: |
          set -o pipefail
          xcodebuild build-for-testing -project Gatefold.xcodeproj -scheme Gatefold \
            -destination 'generic/platform=iOS Simulator' ARCHS="$(uname -m)" \
            -derivedDataPath "$RUNNER_TEMP/dd" 2>&1 | tee "$RUNNER_TEMP/build.log" | tail -60
          ls "$RUNNER_TEMP"/dd/Build/Products/*.xctestrun
          tar -czf "$RUNNER_TEMP/products.tgz" -C "$RUNNER_TEMP/dd/Build" Products
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.artifact }}
          path: ${{ runner.temp }}/products.tgz
          # Long enough for "Re-run failed jobs" a few days later.
          retention-days: 5
          compression-level: 0
          overwrite: true
      - uses: actions/upload-artifact@v4
        if: failure() || cancelled()
        with:
          name: build-log
          path: ${{ runner.temp }}/build.log
          overwrite: true

  core:
    name: GatefoldCore tests
    # GatefoldCore is pure Swift (Foundation only, no UIKit or Readium), so it tests on Linux and
    # spends no macOS minutes. The app's build still compiles it against the iOS 27 SDK below.
    # In Swift's own image: the Ubuntu 26.04 runner image stopped carrying Swift (exit 127 on
    # `swift --version`, 2026-11-05).
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.app != 'false' }}
    runs-on: ubuntu-latest
    container: swift:6.2
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: swift test
        run: swift test --package-path Packages/GatefoldCore
      - name: The simulator helper, offline (a fake xcrun; no simulator)
        run: |
          command -v python3 >/dev/null || { apt-get update -qq && apt-get install -y -qq python3 >/dev/null; }
          python3 -I scripts/ci-simulator.py --selftest
          bash scripts/test-ci-simulator.sh
      - name: Every listed UI test exists, and none runs in two shards (gatefold#39)
        run: |
          python3 -I scripts/ci-shards.py --selftest
          python3 -I scripts/ci-shards.py check --expect scripts/ci-shards.expect

  # UI tests run in shards, each on its own runner from the one build, so a pull request's checks fit the PR clock
  # (gatefold#39). The split follows the slowest pass of each test in ten runs (green 42675099629, 42640941539,
  # 42584275845 and 42570370853, and main's 42673726551, 42666016340, 42656170735, 42605468542, 42605267361 and
  # 42576626603): about 10 to 13 min of tests a pull-request shard. A test that alone takes longer has a shard of its
  # own. Each required check is a gate job below, green only when every one of its shards passed. Shards with
  # `pr_tests: none` run on main and on full-list pull requests only.
  # Each `timeout` is the shard's measured time / 0.7, plus 12 for the logs after the tests (gatefold#141): 9 min of
  # setup (job start to booted: median 4.7, p90 8.1 over 89 jobs in 40 runs) plus its tests' slowest passes; a cold
  # shard adds 4 min for the erase before /0.7 and 10 for one fresh device (gatefold#71).
  # scripts/ci-shards.py (in `GatefoldCore tests`) fails when a listed test does not exist or runs in two shards.
  ipad-place:
    name: iPad place shard (${{ matrix.shard }})
    needs: [changes, build]
    if: ${{ !cancelled() && needs.changes.outputs.app != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The rotation tests on an erased iPad (the cold step), each shard on its own: 606, 548 and 716 s.
          - shard: ipad-place-cold-rotate
            tests: >-
              RotationRepro/testRotateThenLeaveWithoutTurning
            cold: true
            timeout: 56 # (9 + 4 + 10.1) / 0.7 = 34, + 10 + 12
            skip: ""
            pr_tests: ""
          - shard: ipad-place-cold-stalled
            tests: >-
              RotationRepro
            skip: >-
              RotationRepro/testRotateThenLeaveWithoutTurning
            cold: true
            timeout: 54 # (9 + 4 + 9.1) / 0.7 = 32, + 10 + 12
            pr_tests: ""
          - shard: ipad-place-cold-midturn
            tests: >-
              RotationMidTransitionUITests
            cold: true
            timeout: 58 # (9 + 4 + 11.9) / 0.7 = 36, + 10 + 12
            skip: ""
            pr_tests: ""
          - shard: ipad-place-portrait
            # 344 + 340 + 52 s
            tests: >-
              NavigationPlaceUITests/testReadInPortraitRotatedThenLeftKeepsHisFirstWords
              NavigationPlaceUITests/testWithPageNumbersOnReadInPortraitRotatedThenLeftKeepsHisFirstWords
              NavigationPlaceUITests/testTheOpeningCoverLetsTheControlsThrough
            timeout: 43 # (9 + 12.3) / 0.7 = 31, + 12
            skip: ""
            pr_tests: ""
            cold: false
          - shard: ipad-place-jumps
            # 227 + 191 + 180 + 153 s
            tests: >-
              NavigationPlaceUITests/testOpenedFromTheShelfThenLeftTwiceWithoutATurnKeepsThePlace
              NavigationPlaceUITests/testAContentsJumpKeepsThePlace
              NavigationPlaceUITests/testScrolledAfterTheLaunchReflowThenLeftKeepsWhereHeScrolled
              NavigationPlaceUITests/testAJumpsVeilHoldsWhileTheChapterLoads
            timeout: 43 # (9 + 12.5) / 0.7 = 31, + 12
            skip: ""
            pr_tests: ""
            cold: false
          - shard: ipad-place-rest
            # The catch-all for new place tests: 153 + 237 + 131 + 102 s
            tests: >-
              NavigationPlaceUITests PositionUITests/testEveryPostureKeepsThePlace CountingPlaceholderUITests
            skip: >-
              NavigationPlaceUITests/testReadInPortraitRotatedThenLeftKeepsHisFirstWords
              NavigationPlaceUITests/testWithPageNumbersOnReadInPortraitRotatedThenLeftKeepsHisFirstWords
              NavigationPlaceUITests/testTheOpeningCoverLetsTheControlsThrough
              NavigationPlaceUITests/testOpenedFromTheShelfThenLeftTwiceWithoutATurnKeepsThePlace
              NavigationPlaceUITests/testAContentsJumpKeepsThePlace
              NavigationPlaceUITests/testScrolledAfterTheLaunchReflowThenLeftKeepsWhereHeScrolled
              NavigationPlaceUITests/testAJumpsVeilHoldsWhileTheChapterLoads
            timeout: 40 # (9 + 10.4) / 0.7 = 28, + 12
            pr_tests: ""
            cold: false
    uses: ./.github/workflows/ui-tests.yml
    with:
      artifact: ${{ needs.build.outputs.artifact }}
      device: "iPad Pro 13-inch"
      sim: gatefold-ipad
      shard: ${{ matrix.shard }}
      tests: ${{ matrix.tests }}
      skip: ${{ matrix.skip }}
      pr_tests: ${{ matrix.pr_tests }}
      full: ${{ needs.changes.outputs.full }}
      cold: ${{ matrix.cold }}
      timeout: ${{ matrix.timeout }}

  ipad-taps:
    name: iPad taps shard (${{ matrix.shard }})
    needs: [changes, build]
    if: ${{ !cancelled() && needs.changes.outputs.app != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each of the two every-tap tests takes longer than 10 min at its slowest (1045 and 1086 s), so each has a
          # shard of its own.
          - shard: ipad-taps-landscape
            tests: >-
              FineTuneTapUITests/testEveryTapFlipsItsSwitchLandscape
            timeout: 50 # (9 + 17.4) / 0.7 = 38, + 12
            skip: ""
            pr_tests: ""
            cold: false
          - shard: ipad-taps-portrait
            tests: >-
              FineTuneTapUITests/testEveryTapFlipsItsSwitchPortrait
            timeout: 51 # (9 + 18.1) / 0.7 = 39, + 12
            skip: ""
            pr_tests: ""
            cold: false
          - shard: ipad-taps-rest
            # The catch-all for new Fine-Tune tests: 351 + 325 + 105 s
            tests: >-
              FineTuneTapUITests
            skip: >-
              FineTuneTapUITests/testEveryTapFlipsItsSwitchLandscape FineTuneTapUITests/testEveryTapFlipsItsSwitchPortrait
            timeout: 44 # (9 + 13.0) / 0.7 = 32, + 12
            pr_tests: ""
            cold: false
          - shard: ipad-taps-furniture
            # 141 + 275 + 305 s
            tests: >-
              PageFurnitureUITests
            timeout: 43 # (9 + 12.0) / 0.7 = 31, + 12
            skip: ""
            pr_tests: ""
            cold: false
    uses: ./.github/workflows/ui-tests.yml
    with:
      artifact: ${{ needs.build.outputs.artifact }}
      device: "iPad Pro 13-inch"
      sim: gatefold-ipad
      shard: ${{ matrix.shard }}
      tests: ${{ matrix.tests }}
      skip: ${{ matrix.skip }}
      pr_tests: ${{ matrix.pr_tests }}
      full: ${{ needs.changes.outputs.full }}
      cold: ${{ matrix.cold }}
      timeout: ${{ matrix.timeout }}

  ipad-reviewer:
    # The reviewers' checks: reopen by hash, true numbers, reader-wide toggles, density, landing; the reader fits its
    # window. Pull requests run its smoke in one shard: the last page's number is the count (#30), and the reader fits
    # its window. Pushes to main run the whole list in three shards of up to about 30 min each, as long as
    # ReopenAfterControls alone.
    name: iPad reviewer shard (${{ matrix.shard }})
    needs: [changes, build]
    if: ${{ !cancelled() && needs.changes.outputs.app != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: ipad-reviewer-controls
            # 1763 s on main; the PR smoke 223 + 105 + 126 s
            tests: >-
              ReopenAfterControlsUITests
            pr_tests: >-
              ReviewerChecksUITests/testTheLastPagesNumberIsTheCount WindowFitUITests
            timeout: 67 # (9 + 29.4) / 0.7 = 55, + 12
            skip: ""
            cold: false
          - shard: ipad-reviewer-numbers
            # 1184 + 588 s
            tests: >-
              ReviewerChecksUITests/testPageNumbersAreOnOrOffInEveryBook
              PageNumberUITests/testOnASpreadEveryTurnMovesOnTwoPages
            pr_tests: >-
              none
            timeout: 68 # (9 + 29.5) / 0.7 = 56, + 12
            skip: ""
            cold: false
          - shard: ipad-reviewer-rest
            # The catch-all for new reviewer checks: 979 + 223 + 139 + 105 + 126 + 151 s
            tests: >-
              ReviewerChecksUITests WindowFitUITests SpreadTurnSettleUITests/testSpreadTurnsLandWithoutSliding
            skip: >-
              ReviewerChecksUITests/testPageNumbersAreOnOrOffInEveryBook
            pr_tests: >-
              none
            timeout: 66 # (9 + 28.7) / 0.7 = 54, + 12
            cold: false
    uses: ./.github/workflows/ui-tests.yml
    with:
      artifact: ${{ needs.build.outputs.artifact }}
      device: "iPad Pro 13-inch"
      sim: gatefold-ipad
      shard: ${{ matrix.shard }}
      tests: ${{ matrix.tests }}
      skip: ${{ matrix.skip }}
      pr_tests: ${{ matrix.pr_tests }}
      full: ${{ needs.changes.outputs.full }}
      cold: ${{ matrix.cold }}
      timeout: ${{ matrix.timeout }}

  duo:
    # The reviewers' standing checks on the Duo: reopen by hash, true numbers and reader-wide toggles (density is the
    # iPad's), and a page a turn with a reopen keeping its numbers; the Duo's Fine-Tune taps; and its reading position
    # through posture and font changes. The taps and the position tests came from `app`, so that check fits the PR
    # clock. Pull requests run all but the reviewers' full list, which pushes to main add in two shards.
    name: Duo shard (${{ matrix.shard }})
    needs: [changes, build]
    if: ${{ !cancelled() && needs.changes.outputs.app != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: duo-taps-portrait
            # 424 + 253 s
            tests: >-
              FineTuneTapUITests/testEveryTapFlipsItsSwitchPortrait FineTuneTapUITests/testAQuickTouchChangesEverySwitchOnce
            timeout: 41 # (9 + 11.3) / 0.7 = 29, + 12
            skip: ""
            pr_tests: ""
            cold: false
          - shard: duo-taps-rest
            # The catch-all for new Fine-Tune tests, and a page a turn: 228 + 105 + 364 s
            tests: >-
              FineTuneTapUITests PageNumberUITests/testEveryTurnMovesOnAPageAndAReopenKeepsTheNumbers
            skip: >-
              FineTuneTapUITests/testEveryTapFlipsItsSwitchPortrait FineTuneTapUITests/testAQuickTouchChangesEverySwitchOnce
              FineTuneTapUITests/testEveryTapFlipsItsSwitchLandscape
            timeout: 42 # (9 + 11.6) / 0.7 = 30, + 12
            pr_tests: ""
            cold: false
          - shard: duo-position
            # 237 + 173 + 86 + 83 + 79 s, and 65 s for the landscape every-tap test, which skips on the Duo
            tests: >-
              PositionUITests FineTuneTapUITests/testEveryTapFlipsItsSwitchLandscape
            timeout: 43 # (9 + 12.1) / 0.7 = 31, + 12
            skip: ""
            pr_tests: ""
            cold: false
          - shard: duo-reviewer-reopen
            # 1473 s
            tests: >-
              ReviewerChecksUITests/testEveryReopenReturnsTheSameWords
            pr_tests: >-
              none
            timeout: 60 # (9 + 24.6) / 0.7 = 48, + 12
            skip: ""
            cold: false
          - shard: duo-reviewer-rest
            # The catch-all for new reviewer checks: 1109 + 283 s (the default spread skips on the Duo)
            tests: >-
              ReviewerChecksUITests
            skip: >-
              ReviewerChecksUITests/testEveryReopenReturnsTheSameWords
            pr_tests: >-
              none
            timeout: 59 # (9 + 23.2) / 0.7 = 47, + 12
            cold: false
    uses: ./.github/workflows/ui-tests.yml
    with:
      artifact: ${{ needs.build.outputs.artifact }}
      device: "iPhone Duo"
      sim: gatefold-duo
      shard: ${{ matrix.shard }}
      tests: ${{ matrix.tests }}
      skip: ${{ matrix.skip }}
      pr_tests: ${{ matrix.pr_tests }}
      full: ${{ needs.changes.outputs.full }}
      cold: ${{ matrix.cold }}
      timeout: ${{ matrix.timeout }}

  ipad-place-gate:
    # The required check for the iPad's place: green when every shard passed, or when only Markdown changed (gatefold#42).
    # Always runs, so the check reports on every pull request; a failed or cancelled shard turns it red.
    name: iPad (place)
    needs: [changes, ipad-place]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          APP: ${{ needs.changes.outputs.app }}
          SHARDS: ${{ needs.ipad-place.result }}
        run: |
          if [ "$APP" = false ]; then echo "Only Markdown changed; nothing to test."; exit 0; fi
          echo "Shards: $SHARDS"
          [ "$SHARDS" = success ]

  ipad-taps-gate:
    # The required check for the iPad's taps: green when every shard passed, or when only Markdown changed (gatefold#42).
    # Always runs, so the check reports on every pull request; a failed or cancelled shard turns it red.
    name: iPad (taps)
    needs: [changes, ipad-taps]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          APP: ${{ needs.changes.outputs.app }}
          SHARDS: ${{ needs.ipad-taps.result }}
        run: |
          if [ "$APP" = false ]; then echo "Only Markdown changed; nothing to test."; exit 0; fi
          echo "Shards: $SHARDS"
          [ "$SHARDS" = success ]

  ipad-reviewer-gate:
    # The required check for the reviewers' checks on the iPad: green when every shard passed, or when only Markdown
    # changed (gatefold#42). Always runs, so the check reports on every pull request; a failed or cancelled shard turns
    # it red.
    name: iPad (reviewer)
    needs: [changes, ipad-reviewer]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          APP: ${{ needs.changes.outputs.app }}
          SHARDS: ${{ needs.ipad-reviewer.result }}
        run: |
          if [ "$APP" = false ]; then echo "Only Markdown changed; nothing to test."; exit 0; fi
          echo "Shards: $SHARDS"
          [ "$SHARDS" = success ]

  duo-gate:
    # The required check for the Duo's UI tests: green when every shard passed, or when only Markdown changed
    # (gatefold#42). Always runs, so the check reports on every pull request; a failed or cancelled shard turns it red.
    name: Duo (the reviewers' checks)
    needs: [changes, duo]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          APP: ${{ needs.changes.outputs.app }}
          SHARDS: ${{ needs.duo.result }}
        run: |
          if [ "$APP" = false ]; then echo "Only Markdown changed; nothing to test."; exit 0; fi
          echo "Shards: $SHARDS"
          [ "$SHARDS" = success ]

  # xcode-27 is the only hosted image with Xcode 27.1: the first SDK with the iPhone Duo fold APIs, the iOS 27
  # deployment target and the iPhone Duo simulator. macos-latest (macOS 26) has only Xcode 26, so these jobs cannot
  # move there. The required check `Build and unit-test the app` is `app` below, green only when the Release build and
  # the unit tests both passed (gatefold#39): the Release build starts with the run instead of after `build`, and the
  # Duo's position tests and Fine-Tune taps are Duo shards.
  release:
    name: Release build for devices
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.app != 'false' }}
    runs-on: xcode-27
    # Up to 27 min measured in the old `app` job (Metal 5.1, xcodegen 4.4, Release build 16.6, and the setup;
    # runs 42570370853 to 42675099629): / 0.7 keeps 30% headroom.
    timeout-minutes: 39
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/select-xcode
      - name: Install the Metal toolchain (the page curl is a Metal shader)
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Generate the Xcode project from project.yml
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate
      - name: Release build for devices (the same binary runs on the Mac as Designed for iPad)
        run: |
          set -o pipefail
          xcodebuild build -project Gatefold.xcodeproj -scheme Gatefold -configuration Release \
            -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO 2>&1 | tail -50

  unit:
    name: Unit tests (iPhone Duo)
    needs: [changes, build]
    if: ${{ !cancelled() && needs.changes.outputs.app != 'false' }}
    runs-on: xcode-27
    # 9 min of setup (job start to booted; p90 8.1 over 89 jobs) and up to 3.9 of unit tests: / 0.7 = 19, and 12 for
    # the logs after the tests (gatefold#141).
    timeout-minutes: 31
    steps:
      - name: Note when the job began, so each test step can stop in time to upload its logs (gatefold#126)
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: ./.github/actions/select-xcode
      - name: Start an iPhone Duo booting
        run: python3 -I scripts/ci-simulator.py start gatefold-duo "iPhone Duo"
      - id: fetch
        # Usually 4 s, but 13 of 144 took over 2 min and one 10.6 min (gatefold#144), in bunches across jobs: the
        # artifact store, not the runner. A download cut off at 4 min tries once more, rather than eating the tests' time.
        uses: actions/download-artifact@v4
        timeout-minutes: 4
        continue-on-error: true
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: ${{ runner.temp }}
      - name: Download the build again (the first try failed or ran past 4 min; gatefold#144)
        if: steps.fetch.outcome != 'success'
        uses: actions/download-artifact@v4
        timeout-minutes: 6
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: ${{ runner.temp }}
      - name: Unpack the app and its tests (built once, for this commit and Xcode)
        env:
          ARTIFACT: ${{ needs.build.outputs.artifact }}
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/dd/Build"
          tar -xzf "$RUNNER_TEMP/products.tgz" -C "$RUNNER_TEMP/dd/Build"
          # The build is keyed by commit and Xcode version and build; this job must have selected the same Xcode.
          want="gatefold-tests-$GITHUB_SHA-xcode-$(xcodebuild -version | tr -s ' \n' '-' | sed 's/-$//; s/^Xcode-//; s/-Build-version-/-/')"
          [ "$want" = "$ARTIFACT" ] || { echo "::error::Built as $ARTIFACT, but this job's Xcode makes $want"; exit 1; }
          echo "XCTESTRUN=$(ls "$RUNNER_TEMP"/dd/Build/Products/*.xctestrun | head -1)" >> "$GITHUB_ENV"
      - name: The iPhone Duo finished booting
        # 1200 s for the boot, the check's listings, and 900 s for one fresh device when the first boot left room
        # (gatefold#71; the sums are in scripts/ci-simulator.py at BOOT_ATTEMPT).
        timeout-minutes: 30
        env:
          CI_SIMULATOR_BUDGET: "1740" # the step's 30 min less one: it ends with its own message, never killed
        run: python3 -I scripts/ci-simulator.py wait gatefold-duo "iPhone Duo" 1200
      - id: left_unit
        uses: ./.github/actions/time-left
        with:
          limit: "31" # the job's timeout-minutes
      - name: Unit tests
        timeout-minutes: ${{ fromJSON(steps.left_unit.outputs.minutes) }}
        env:
          STEP_UNTIL: ${{ steps.left_unit.outputs.until }}
        run: |
          set -o pipefail
          python3 -I scripts/ci-within.py --until "$STEP_UNTIL" -- xcodebuild test-without-building -xctestrun "$XCTESTRUN" \
            -destination "$DESTINATION" \
            -only-testing:GatefoldTests \
            -resultBundlePath "$RUNNER_TEMP/unit.xcresult" 2>&1 | tee "$RUNNER_TEMP/unit.log" | tail -200
      - name: Why each failed test failed (from the result bundles, text withheld)
        if: failure() || cancelled()
        timeout-minutes: 5
        run: python3 -I scripts/ci-failures.py "$RUNNER_TEMP"/unit.xcresult
      - uses: actions/upload-artifact@v4
        # Every run, so a green run can be audited too (gatefold#127): kept 3 days unless the job failed.
        if: always()
        # A green job stays green if the artifact store has a bad moment.
        continue-on-error: true
        with:
          name: unit-results-${{ github.run_attempt }}
          retention-days: ${{ job.status != 'failure' && 3 || 0 }} # 0: the repository's default
          path: ${{ runner.temp }}/unit.log
      - uses: actions/upload-artifact@v4
        # The result bundle only when the job did not pass: it is large (gatefold#127).
        if: failure() || cancelled()
        continue-on-error: true
        with:
          name: unit-xcresults-${{ github.run_attempt }}
          path: ${{ runner.temp }}/unit.xcresult

  app:
    # The required check for the app's Release build and unit tests: green when both passed, or when only Markdown
    # changed (gatefold#42). Always runs, so the check reports on every pull request; a failed or cancelled job turns
    # it red.
    name: Build and unit-test the app
    needs: [changes, release, unit]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          APP: ${{ needs.changes.outputs.app }}
          RELEASE: ${{ needs.release.result }}
          UNIT: ${{ needs.unit.result }}
        run: |
          if [ "$APP" = false ]; then echo "Only Markdown changed; nothing to build."; exit 0; fi
          echo "Release build: $RELEASE; unit tests: $UNIT"
          [ "$RELEASE" = success ] && [ "$UNIT" = success ]
