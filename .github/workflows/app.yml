name: App

# Probe for gatefold#198 (never merged): quiet a new simulator the moment `simctl boot` returns, in one spawn (a shell
# inside the simulator removes every job in quiet-sim.labels), against today's boot. Samples the runner's 1-min load
# every 20 s and times a Settings launch every 60 s. No app, no tests, no book text.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boot:
    name: ${{ matrix.how }} ${{ matrix.rep }}
    runs-on: xcode-27
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        how: [control, onespawn]
        rep: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/select-xcode
      - env:
          HOW: ${{ matrix.how }}
        run: |
          set -u
          read -r rt dt < <(.github/probe/sim.sh pick)
          labels=$(grep -vE '^\s*(#|$)' .github/scripts/quiet-sim.labels | tr '\n' ' ')
          .github/probe/sim.sh sample "$HOW" 1320 &
          u=$(xcrun simctl create probe-ipad "$dt" "$rt"); echo "created $u"
          t=$SECONDS; xcrun simctl boot "$u"; echo "BOOT returned after $((SECONDS-t)) s"
          quiet() {
            local s=$SECONDS
            out=$(xcrun simctl spawn "$u" /bin/sh -c 'n=0; for l in "$@"; do launchctl remove "$l" 2>/dev/null && n=$((n+1)); done; echo $n' sh $labels 2>&1)
            echo "QUIET $1 at $((SECONDS-t)) s: removed $out in $((SECONDS-s)) s, load $(sysctl -n vm.loadavg | awk '{print $2}')"
          }
          if [ "$HOW" = onespawn ]; then quiet early; fi
          xcrun simctl bootstatus "$u" -b > "$RUNNER_TEMP/bs.txt" 2>&1; echo "BOOTSTATUS $HOW done ($?) after $((SECONDS-t)) s"
          quiet after-boot
          n=0; for l in $labels; do xcrun simctl spawn "$u" launchctl list | grep -q " $l$" && n=$((n+1)); done; echo "STILL LOADED $n"
          for i in $(seq 1 12); do
            t0=$SECONDS; xcrun simctl launch "$u" com.apple.Preferences >/dev/null 2>&1; r=$?
            echo "LAUNCH $i at $((SECONDS-t)) s: $((SECONDS-t0)) s exit $r load $(sysctl -n vm.loadavg | awk '{print $2}')"
            xcrun simctl terminate "$u" com.apple.Preferences >/dev/null 2>&1; sleep 60
          done
          wait
