name: UI test shard

# One shard of App's UI tests, called by app.yml. The job starts with the run (or, on a pull request, when its lane
# frees), not after `build`: it boots its new simulator (alongside `Build for testing`, when it starts with the
# run), waits for that build's artifact (named by commit and Xcode version), and runs this shard's tests with
# test-without-building (gatefold#39). The shards of one required check report through
# that check's gate job in app.yml. scripts/ci-shards.py checks the lists in app.yml: every listed test exists, and
# none runs in two shards of a tier.

on:
  workflow_call:
    inputs:
      device:
        description: Device name, or a prefix of it ("iPad Pro 13-inch", "iPhone Duo")
        type: string
        required: true
      sim:
        description: The simulator's name (gatefold-ipad, gatefold-duo)
        type: string
        required: true
      shard:
        description: Unique name for this shard's artifacts
        type: string
        required: true
      tests:
        description: The full list, run on main and on full-list pull requests (space-separated, under GatefoldUITests)
        type: string
        default: ""
      skip:
        description: Tests skipped from the full list (for a catch-all shard)
        type: string
        default: ""
      pr_tests:
        description: The pull-request list; "none" means this shard runs only on main and on full-list pull requests.
        type: string
        default: "none"
      full:
        description: needs.changes.outputs.full ('false' on a pull request that runs the PR lists)
        type: string
        default: "true"
      pr_when:
        description: The group of paths whose change runs this shard's PR list (smoke, place-undo, place-jumps, taps)
        type: string
        default: ""
      fired:
        description: needs.changes.outputs.fired, the groups this pull request's paths touch, space-separated
        type: string
        default: ""
      passed:
        description: >-
          needs.changes.outputs.shards: in the merge queue, the shards that already passed on this very tree in another
          group's run (scripts/ci-proof.py --shards), space-separated; this shard reports instead of running if it's one
        type: string
        default: ""
      extra:
        description: needs.changes.outputs.edited-ipad or edited-duo, the UI test classes this pull request edits that run on this device; a smoke shard runs them too
        type: string
        default: ""
      cold:
        description: >-
          The rotation tests: run on this job's just-created iPad before anything else warms it, with the spread's
          90 s floor. A new simulator is at least as cold as an erased one (gatefold#150, #167), so there is no erase.
        type: boolean
        default: false
      hinge:
        description: >-
          Open the Duo's hinge for the tests: Device Hub, driven by ouro-devicehub (ourostack/ouro-ui-apple) at the
          revision or release project.yml asks for, answers each OuroDuoHinge request. The tests get TEST_RUNNER_OURO_DUO_POSTURE_DIR,
          and a skipped test fails the shard, since a skip there means the hinge never reached it. The build takes a
          few minutes of the 30 for setup, while the simulator boots.
        type: boolean
        default: false
      lane:
        description: The pull-request lane, 1 to 18, that this shard waits in (gatefold#286; see "macOS lanes" in app.yml)
        type: number
        required: true
      try:
        description: >-
          "-retry" when app.yml's `retry` job runs this shard again after GitHub cancelled it (gatefold#404): its
          artifacts take the suffix, since the cancelled job's names are used
        type: string
        default: ""
      timeout:
        description: >-
          The job's limit in minutes: 30 of setup (the simulator wait step's own limit; gatefold#198), twice its
          tests' slowest passing times (the test step's budget, however long the boot took), and 12 for the logs
          after the tests (gatefold#141)
        type: number
        required: true

jobs:
  # A shard with nothing to run on this pull request still ends in one successful job, so its caller's result is
  # success and the gate stays strict (a caller whose only job skipped has no documented result).
  main-only:
    name: Main only
    if: ${{ !(inputs.full != 'false' || (inputs.pr_tests != 'none' && contains(format(' {0} ', inputs.fired), format(' {0} ', inputs.pr_when)))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "Nothing in this shard guards what this pull request touches; it runs on main."

  # In the merge queue, a shard that already passed on this very tree in another group's run (inputs.passed) reports
  # success naming that, rather than running again on a fresh runner (scripts/ci-proof.py --shards).
  passed:
    name: Passed on this tree
    if: ${{ contains(format(' {0} ', inputs.passed), format(' {0} ', inputs.shard)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "::notice::Shard ${{ inputs.shard }} passed on this tree in another merge-queue run; not run again."

  run:
    name: Tests
    if: ${{ (inputs.full != 'false' || (inputs.pr_tests != 'none' && contains(format(' {0} ', inputs.fired), format(' {0} ', inputs.pr_when)))) && !contains(format(' {0} ', inputs.passed), format(' {0} ', inputs.shard)) }}
    runs-on: xcode-27
    # PR lane (gatefold#286): each caller's matrix entry names one of 18 shard lanes (`lane`), and odd and even pull
    # requests each get their own set of the 18, so 36 in all; see "macOS lanes" at the top of app.yml. Never
    # cancel-in-progress.
    concurrency:
      group: >-
        ${{ github.event_name == 'pull_request'
        && format('gatefold-macos-pr-lane-shard-{0}-{1}', inputs.lane, (endsWith(format('{0}', github.event.pull_request.number), '1') || endsWith(format('{0}', github.event.pull_request.number), '3') || endsWith(format('{0}', github.event.pull_request.number), '5') || endsWith(format('{0}', github.event.pull_request.number), '7') || endsWith(format('{0}', github.event.pull_request.number), '9')) && '1' || '0')
        || format('ui-tests-{0}-{1}-{2}', github.run_id, github.run_attempt, inputs.shard) }}
      queue: max
    timeout-minutes: ${{ inputs.timeout }}
    permissions:
      contents: read
      actions: write
    steps:
      - name: Note when the job began, so each test step can stop in time to upload its logs (gatefold#126)
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: ./.github/actions/select-xcode
        with:
          xcode: "27.2"
      - name: Turn off Spotlight indexing on the runner
        timeout-minutes: 2
        # Nothing in a shard searches the Mac, and its indexer (mds, mds_stores) held runnable threads and CPU on this
        # 3-CPU runner through the tests. Only the runner's own indexing; the simulator's is in quiet-sim.labels.
        run: sudo -n mdutil -a -i off > /dev/null || echo "::warning::Spotlight indexing stays on (mdutil failed)"
      # A warm device (gatefold#533): one that booted once on this runner image, saved by warm-sim.yml on main. Its clone boots in about half a first boot's time (boot-sim.sh has the numbers). Not for the rotation
      # shards, which need a device at least as cold as an erased one. A miss, or any trouble here, boots a new device
      # as before (boot-sim.sh).
      - id: warm-key
        name: The warm ${{ inputs.device }}'s cache key
        if: ${{ !inputs.cold }}
        continue-on-error: true
        timeout-minutes: 2
        run: python3 -I scripts/ci-simulator.py key "${{ inputs.device }}" | tee -a "$GITHUB_OUTPUT"
      - id: warm
        name: Restore the warm ${{ inputs.device }}
        if: ${{ steps.warm-key.outputs.key != '' }}
        # 14 to 26 s on the probe runners; a stalled one gives up well inside the 30 min of setup.
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/cache/restore@v4
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: "1"
        with:
          path: ~/warm-sim
          key: ${{ steps.warm-key.outputs.key }}
      - name: Keep the runner's agent ahead of the simulator's boot (gatefold#404)
        # A first boot freezes this 3-CPU runner for 10 min and more (load 500 to 760); GitHub then loses the agent and
        # cancels the job from outside. scripts/ci-runner-priority.py raises the agent's priority and lowers the simulator's.
        run: nohup python3 -I scripts/ci-runner-priority.py 1500 > /dev/null 2>&1 &
      - name: Start the ${{ inputs.device }} booting
        env:
          BOOT_SIM_WARM_SET: ${{ steps.warm.outputs.cache-hit == 'true' && '~/warm-sim' || '' }}
        run: |
          [ -z "$BOOT_SIM_WARM_SET" ] || BOOT_SIM_WARM_SET="$HOME/warm-sim"
          export BOOT_SIM_WARM_SET
          echo "Warm device: ${BOOT_SIM_WARM_SET:-none}"
          python3 -I scripts/ci-simulator.py start "${{ inputs.sim }}" "${{ inputs.device }}"
      - name: Build ouro-devicehub, which moves the Duo's hinge (hinge shards)
        if: inputs.hinge
        run: |
          set -euo pipefail
          # The same Ouro UI for Apple the app resolves: a pinned `revision:`, or the newest release within its
          # `minorVersion:` (1.0.0 takes the newest v1.0.x tag).
          read -r key value <<< "$(awk '/^  OuroUIApple:/ { f = 1; next } f && /^  [A-Za-z]/ { exit }
            f && /(revision|minorVersion):/ { sub(":", "", $1); print $1, $2; exit }' project.yml)"
          case "$key" in
            revision) rev="$value" ;;
            minorVersion)
              series="v${value%.*}."
              rev="$(git ls-remote --tags --refs https://github.com/ourostack/ouro-ui-apple "refs/tags/${series}*" \
                | sed 's#.*refs/tags/##' | sort -V | tail -1)" ;;
            *) rev="" ;;
          esac
          [ -n "$rev" ] || { echo "::error::could not read OuroUIApple's revision or minorVersion from project.yml"; exit 1; }
          echo "ouro-devicehub from ourostack/ouro-ui-apple $rev"
          git init -q "$RUNNER_TEMP/ouro-ui-apple"
          git -C "$RUNNER_TEMP/ouro-ui-apple" fetch -q --depth 1 https://github.com/ourostack/ouro-ui-apple "$rev"
          git -C "$RUNNER_TEMP/ouro-ui-apple" checkout -q FETCH_HEAD
          (cd "$RUNNER_TEMP/ouro-ui-apple" && swift build -c release --product ouro-devicehub 2>&1 | tail -5 \
            && echo "HUB=$(swift build -c release --show-bin-path)/ouro-devicehub" >> "$GITHUB_ENV")
      - name: Sample the runner's load, and whose threads make it, every 20 s for the whole job (gatefold#39)
        run: nohup sh scripts/ci-load-sample.sh "$RUNNER_TEMP/load.log" 20 > /dev/null 2>&1 &
      - name: Wait for this commit's build (Build for testing runs while the simulator boots)
        id: artifact
        # Up to the build's own 35 min; it usually lands 2 to 4 min after the run starts.
        timeout-minutes: 36
        uses: ./.github/actions/await-build
      - name: The ${{ inputs.device }} finished booting
        # Before the download: a first boot holds the runner's load at 500 to 760, and a download beside it stalls to
        # its 4-min limit (gatefold#198). boot-sim.sh retries a boot that fails or hangs (#57); this waits with a limit.
        # 1200 s for the boot, the check's listings, and 920 s for one fresh device when the first boot left room
        # (gatefold#71; the sums are in scripts/ci-simulator.py at BOOT_ATTEMPT).
        timeout-minutes: 30
        env:
          CI_SIMULATOR_BUDGET: "1740" # the step's 30 min less one: it ends with its own message, never killed
        run: python3 -I scripts/ci-simulator.py wait "${{ inputs.sim }}" "${{ inputs.device }}" 1200
      - name: Free the warm device's copy (its clone, if any, is booted)
        if: ${{ !cancelled() && steps.warm.outputs.cache-hit == 'true' }}
        run: rm -rf ~/warm-sim
      - name: Open Device Hub and serve the tests' hinge requests (hinge shards)
        if: inputs.hinge
        run: |
          set -eu
          open -a "$(xcode-select -p)/../Applications/DeviceHub.app"
          sleep 20
          "$HUB" dump | tail -20
          dir="$RUNNER_TEMP/duo"; mkdir -p "$dir"
          nohup "$HUB" serve "$dir" > "$RUNNER_TEMP/devicehub.log" 2>&1 &
          echo "TEST_RUNNER_OURO_DUO_POSTURE_DIR=$dir" >> "$GITHUB_ENV"
      - id: fetch
        # Usually 4 s, but 13 of 144 took over 2 min and one 10.6 min (gatefold#144), in bunches across jobs: the
        # artifact store, not the runner. A download cut off at 4 min tries once more, rather than eating the tests' time.
        uses: actions/download-artifact@v4
        timeout-minutes: 4
        continue-on-error: true
        with:
          name: ${{ steps.artifact.outputs.artifact }}
          path: ${{ runner.temp }}
      - id: whole
        # A download can report success and still end truncated ("truncated gzip input" at the unpack; gatefold#89).
        name: The download is whole (gzip -t)
        if: steps.fetch.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 2
        run: gzip -t "$RUNNER_TEMP/products.tgz"
      - name: Download the build again (the first try failed, ran past 4 min or came truncated; gatefold#144, gatefold#89)
        if: steps.fetch.outcome != 'success' || steps.whole.outcome != 'success'
        uses: actions/download-artifact@v4
        timeout-minutes: 6
        with:
          name: ${{ steps.artifact.outputs.artifact }}
          path: ${{ runner.temp }}
      - name: Unpack the app and its tests (built once, for this commit and Xcode)
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/dd/Build"
          tar -xzf "$RUNNER_TEMP/products.tgz" -C "$RUNNER_TEMP/dd/Build"
          echo "XCTESTRUN=$(ls "$RUNNER_TEMP"/dd/Build/Products/*.xctestrun | head -1)" >> "$GITHUB_ENV"
      - name: Fill the app's Metal shader cache before the tests (gatefold#487)
        # A first draw compiles its shader on the app's main thread, waiting on the simulator's compiler service, which
        # a busy runner left unrun for 40 s and more (main held up to 207 s, run 44292342494). One launch here draws the
        # shelf, the open into a book, its controls and Fine-Tune; the tests then find those shaders cached. Before the
        # logs below, so its holds take none of the hang sampler's rounds and a crash in it is never the tests'. Ends
        # by its bound, which leaves setup inside the 30 min `left` allows, and never fails the job.
        timeout-minutes: 4
        continue-on-error: true
        run: |
          left=$((JOB_START + 30 * 60 - 60 - $(date +%s)))
          sh scripts/ci-warm-metal.sh "$UDID" "$(ls -d "$RUNNER_TEMP"/dd/Build/Products/*-iphonesimulator/Gatefold.app | head -1)" \
            "$RUNNER_TEMP/warm.log" "$((left < 180 ? left : 180))"
      - name: Keep the app's place log as it runs (file and progression only, never the book's words)
        run: |
          sh scripts/ci-crashes.sh mark
          # One `log stream` for the place, runningboardd and reader logs (scripts/ci-app-log.sh): each stream is another
          # client the simulator's diagnosticd matches every message against.
          nohup sh scripts/ci-app-log.sh "$UDID" "$RUNNER_TEMP" > /dev/null 2>&1 &
          # Every thread of the app and its busiest neighbours while main is held past 30 s (gatefold#357): the app's
          # own watch names main's work only, and nothing when main waits on another thread or the process starves.
          nohup sh scripts/ci-hang-sample.sh "$RUNNER_TEMP/reader.log" "$RUNNER_TEMP/hangs" >> "$RUNNER_TEMP/hangs.log" 2>&1 &
      - id: left
        uses: ./.github/actions/time-left
        with:
          limit: ${{ inputs.timeout }}
          boot: "30" # the simulator wait step's timeout-minutes, above
      - name: This shard's tests
        # Gets its tests' whole budget whenever setup ended within `boot` minutes (gatefold#198, #353), then 2 min for
        # ci-within to stop them, and ends at least 10 min before the job's limit: a job cut off at its limit skips
        # every later step and uploads nothing.
        timeout-minutes: ${{ fromJSON(steps.left.outputs.minutes) }}
        env:
          STEP_UNTIL: ${{ steps.left.outputs.until }}
          # The tests size their hang guards to end before this step does (GatefoldUITests/HangGuard.swift, gatefold#221).
          TEST_RUNNER_GATEFOLD_STEP_UNTIL: ${{ steps.left.outputs.until }}
          FULL: ${{ inputs.full }}
          HINGE: ${{ inputs.hinge }}
          TESTS: ${{ inputs.tests }}
          SKIP: ${{ inputs.skip }}
          PR_TESTS: ${{ inputs.pr_tests }}
          EXTRA: ${{ inputs.pr_when == 'smoke' && inputs.extra || '' }}
          # Five rounds of the controls-then-numbers reopen (about 2 min each); 30 locally.
          TEST_RUNNER_GATEFOLD_REOPEN_ROUNDS: "5"
          # The rotation shards only: the runner draws the spread two to four times slower than a Mac (up to 50 s
          # seen), so 90 s still fails a page left stuck for good. Empty elsewhere, which the tests read as no floor.
          TEST_RUNNER_GATEFOLD_SPREAD_FLOOR: ${{ inputs.cold && '90' || '' }}
        run: |
          set -o pipefail
          # A pull request runs the PR list, and in a smoke shard the UI test classes it edits; main and full-list pull
          # requests run the full list, less the skipped tests.
          if [ "$FULL" = false ]; then
            list="$PR_TESTS $EXTRA"; skip=""
          else
            list="$TESTS"; skip="$SKIP"
          fi
          # An empty list would run the whole UI suite.
          [ -n "$list" ] || { echo "::error::A shard needs a test list"; exit 1; }
          only=()
          for t in $list; do only+=("-only-testing:GatefoldUITests/$t"); done
          for t in $skip; do only+=("-skip-testing:GatefoldUITests/$t"); done
          echo "$(date -u +%T) running: ${only[*]}"
          # Each test's result prints as it finishes: a job cut off at its limit still names the slow test
          # (run 42393941976's reviewer leg printed nothing, since this read the log only at the end).
          run_tests() {
            python3 -I scripts/ci-within.py --until "$STEP_UNTIL" -- xcodebuild test-without-building -xctestrun "$XCTESTRUN" \
              -destination "$DESTINATION" "${only[@]}" \
              -resultBundlePath "$RUNNER_TEMP/ui.xcresult" 2>&1 | tee "$RUNNER_TEMP/ui.log" \
              | grep --line-buffered -E "Test Case .*(started|passed|failed|skipped)|FEEL:|TEST (SUCCEEDED|FAILED)|REPRO (setup|jump|round|SUMMARY|visibleSettleMove)|MIDTURN|TAPRATE|PLACEHOLDER|REVIEWER|OLDPAGEHELD|TURNWAIT|WINDOWFIT|REOPEN round [0-9]+:|probe says|probe timing|\.swift:[0-9]+: error|::error::" \
              | awk '{ if (match($0, /XCTAssert[A-Za-z]* failed/)) $0 = substr($0, 1, RSTART + RLENGTH - 1) " (text withheld)"; print; fflush() }'
            return "${PIPESTATUS[0]}"
          }
          status=0
          run_tests || status=$?
          echo "$(date -u +%T) done ($status)"
          # The test runner never started, for a reason in the machine (scripts/ci-bootstrap.py; gatefold#135): this
          # host's simulator service is sick, and erasing or booting another device on it hung or ran out of time
          # (#429's own run). Fail at once with the line rerun-runner.yml reads, so a fresh runner runs the shard.
          if [ "$status" != 0 ] && [ "$status" != 124 ] && why=$(python3 -I scripts/ci-bootstrap.py why "$RUNNER_TEMP/ui.log"); then
            echo "::error title=The runner, not the app::No test started: $why. No app code ran; rerun it on a fresh runner (gatefold#135)."
          fi
          # Every entry must have run at least one test: a name that matches nothing is a red, never a quiet pass.
          # Checked after a passing run only; a run that failed or ran out of time is red already.
          if [ "$status" = 0 ]; then
            for t in $list; do
              cls="${t%%/*}"; want="-[GatefoldUITests.$cls "
              [ "$t" != "$cls" ] && want="-[GatefoldUITests.$cls ${t#*/}]"
              if ! grep -qF -- "$want" "$RUNNER_TEMP/ui.log"; then
                echo "::error title=No tests ran::$t matched no test."
                status=1
              fi
            done
          fi
          # A hinge shard's skip means the request directory never reached the test, so the Duo never opened.
          if [ "$HINGE" = true ] && grep -q "Test Case .* skipped" "$RUNNER_TEMP/ui.log"; then
            echo "::error title=The hinge never reached a test::a test skipped in a hinge shard, so the open Duo went unchecked."
            status=1
          fi
          exit $status
      - name: The app did not crash, and the system did not end it for memory (gatefold#76)
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        run: sh scripts/ci-crashes.sh check
      - name: Why each failed test failed (from the result bundles, text withheld)
        if: failure() || cancelled()
        timeout-minutes: 5
        run: python3 -I scripts/ci-failures.py "$RUNNER_TEMP"/ui.xcresult
      - name: The app's place log, closed off (file and progression only, never the book's words)
        # Every run, so a green run can be audited too (gatefold#127).
        if: always()
        # Kept as the job ran (a `log show` over hours of a busy simulator took 23 min and ran the job
        # out of time, losing every log), so here it is only closed off.
        timeout-minutes: 2
        run: |
          pkill -f "log stream --style compact" || true
          pkill -f "ci-load-sample.sh" || true
          pkill -f "ci-hang-sample.sh" || true
          pkill -f "ouro-devicehub serve" || true
          wc -l < "$RUNNER_TEMP/place.log" || true
      - uses: actions/upload-artifact@v4
        # Every run, so a green run can be audited too (gatefold#127): kept 3 days unless the job failed.
        if: always()
        # A green job stays green if the artifact store has a bad moment.
        continue-on-error: true
        with:
          # By attempt, so a rerun keeps the failed attempt's logs beside its own.
          name: ${{ inputs.shard }}-results-${{ github.run_attempt }}${{ inputs.try }}
          retention-days: ${{ job.status != 'failure' && 3 || 0 }} # 0: the repository's default
          path: |
            ${{ runner.temp }}/place.log
            ${{ runner.temp }}/rb.log
            ${{ runner.temp }}/reader.log
            ${{ runner.temp }}/warm.log
            ${{ runner.temp }}/load.log
            ${{ runner.temp }}/load.log.threads
            ${{ runner.temp }}/crashes
            ${{ runner.temp }}/ui.log
            ${{ runner.temp }}/hangs
            ${{ runner.temp }}/hangs.log
            ${{ runner.temp }}/devicehub.log
            ${{ runner.temp }}/duo/shots
      - uses: actions/upload-artifact@v4
        # The result bundles only when the job did not pass: they are large (gatefold#127).
        if: failure() || cancelled()
        continue-on-error: true
        with:
          name: ${{ inputs.shard }}-xcresults-${{ github.run_attempt }}${{ inputs.try }}
          path: ${{ runner.temp }}/ui.xcresult
      # No fail-fast here, even in the merge queue: a UI-test shard's failure must not cancel its siblings. Each
      # sibling that finishes leaves a pass on this tree, so a re-enqueue reruns only the shard that failed
      # (scripts/ci-proof.py). Cancelling them threw those passes away, and the rerun gave every flake a new chance.
