name: Stuck-run watchdog

# Every 5 min: cancel a run whose job has outlived its workflow's timeout by 5 min, and force-cancel it 2 min later if
# it is still running (scripts/ci-stuck.py). A lost runner leaves its job in_progress forever, and a merge queue behind
# it waits: merge-group run 44213268613 stalled the queue for about 2 h until it was force-cancelled by hand. Each
# cancel is listed in the step summary, and a merge-group run's pull request gets a comment. Linux only, one page of
# runs per quiet tick; HTTP 403 or 429 stops it. On a pull request that edits it, only its selftest runs.
#
# Each pass also cancels merge-group runs nobody will read: queued or in progress on a head commit that is no longer a
# merge queue entry's (the queue rebuilt that group) nor one of main's newest. On 2026-11-18 three such runs held 12
# macOS runners while the queue's front group had 39 jobs queued for 76 min. A queue read that fails cancels nothing.
# Every new merge group starts this workflow too, and that run does only this sweep, so the group it replaced is
# cancelled within seconds of its rebuild, not at the next 5-min tick. This is not a required check.
on:
  merge_group:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/ci-stuck.py"
      - ".github/workflows/stuck-runs.yml"

permissions:
  contents: read

# No concurrency group: a tick whose own runner was lost must not hold back the next one. Two ticks that overlap
# can both cancel a run; a cancel of a run that is already ending is ignored.

jobs:
  watch:
    name: Stuck-run watchdog
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
      actions: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            scripts/ci-stuck.py
            .github/workflows
      - name: The decision logic passes its selftest
        run: python3 -I scripts/ci-stuck.py --selftest
      - name: Cancel orphaned merge-group runs, and runs with a job past its timeout
        if: github.event_name != 'pull_request' && github.event_name != 'merge_group' && github.repository == 'ourostack/gatefold'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -I scripts/ci-stuck.py check --act
      - name: Cancel the merge-group runs this new group replaced
        if: github.event_name == 'merge_group' && github.repository == 'ourostack/gatefold'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -I scripts/ci-stuck.py orphans --act
