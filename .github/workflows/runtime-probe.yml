# Temporary probe (not for merge): when does the runner swap its simulator runtimes from the plain disk image to the
# cryptex copy ("Image is a duplicate ... preferring cryptex variant"), and how long does a boot take after that?
name: Runtime probe
on:
  pull_request:
    paths: [.github/workflows/runtime-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    name: Probe ${{ matrix.n }}
    runs-on: xcode-27
    timeout-minutes: 30
    strategy:
      matrix:
        n: [1, 2, 3]
    steps:
      - name: Watch the runtime images until they settle
        run: |
          start=$(date +%s)
          echo "job start $(date -u +%T), uptime: $(uptime)"
          sudo xcode-select -s /Applications/Xcode_27.1.app
          prev=""
          while :; do
            t=$(( $(date +%s) - start ))
            now=$(xcrun simctl runtime list -j | python3 -c '
          import json,sys,collections
          d=json.load(sys.stdin)
          rows=sorted(f"{v.get(\"runtimeIdentifier\",\"?\").split(\".\")[-1]} {v.get(\"build\")} {v.get(\"state\")} {v.get(\"kind\")} {(v.get(\"mountPath\") or \"\").split(\"/\")[-1]}" for v in d.values() if v.get("platformIdentifier","").endswith("iphonesimulator") or "iOS" in v.get("runtimeIdentifier",""))
          c=collections.Counter((v.get("runtimeIdentifier"),v.get("build")) for v in d.values())
          dup=sum(1 for n in c.values() if n>1); busy=sum(1 for v in d.values() if v.get("state")!="Ready")
          print(f"dup={dup} busy={busy}"); print("\n".join(rows))')
            if [ "$now" != "$prev" ]; then echo "--- t=${t}s"; echo "$now"; prev="$now"; fi
            case "$now" in "dup=0 busy=0"*) echo "SETTLED at ${t}s"; echo "settled=$t" >> "$GITHUB_ENV"; break;; esac
            [ $t -gt 1200 ] && { echo "NOT SETTLED in 1200s"; break; }
            sleep 10
          done
      - name: Boot an iPad on iOS 27.0 after that
        run: |
          s=$(date +%s)
          rt=$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; print([r["identifier"] for r in json.load(sys.stdin)["runtimes"] if r["identifier"].endswith("iOS-27-0") and r["isAvailable"]][0])')
          kind=$(xcrun simctl list devicetypes -j | python3 -c 'import json,sys; print([d["identifier"] for d in json.load(sys.stdin)["devicetypes"] if d["name"].startswith("iPad Pro 13-inch")][0])')
          u=$(xcrun simctl create probe "$kind" "$rt")
          xcrun simctl bootstatus "$u" -b > /dev/null
          echo "BOOT took $(( $(date +%s) - s ))s after settling at ${settled:-?}s"
          sudo log show --last 30m --predicate 'process == "simdiskimaged"' --style compact 2>/dev/null | grep -E 'preferring cryptex|Unmounting /Library|Disk disappeared|login session' | cut -c1-220 || true
          xcrun simctl delete "$u"
