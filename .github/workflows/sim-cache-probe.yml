name: Simulator cache probe

# PROBE ONLY (branch ci-cached-sim), removed before merge: never on main, never in the merge queue.
# seed: app.yml's warm-sim steps (boot as a shard does, idle until the runner's load settles, shut down, save).
# restore: on a fresh runner, the cache restored and the shard's own start and wait (boot-sim.sh's warm path) timed,
# then two UI tests that run on that device.
on:
  pull_request:
    paths:
      - .github/workflows/sim-cache-probe.yml
      - scripts/sim-cache-probe.sh

permissions:
  contents: read
  actions: read

jobs:
  seed:
    name: Seed (${{ matrix.device }})
    runs-on: xcode-27
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - device: "iPad Pro 13-inch"
            sim: gatefold-ipad
          - device: "iPhone Duo"
            sim: gatefold-duo
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/select-xcode
        with:
          xcode: "27.2"
      - id: key
        run: |
          python3 -I scripts/ci-simulator.py key "${{ matrix.device }}" | sed "s/^key=/key=probe4-${{ github.run_id }}-/" | tee -a "$GITHUB_OUTPUT"
      - run: bash scripts/sim-cache-probe.sh plan "${{ matrix.device }}"
      - run: bash scripts/sim-cache-probe.sh seedplain
      - uses: actions/cache/save@v4
        with:
          path: ~/warm-sim
          key: ${{ steps.key.outputs.key }}

  restore:
    name: Restore (${{ matrix.device }}, ${{ matrix.mode }})
    needs: seed
    if: ${{ !cancelled() }}
    runs-on: xcode-27
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - device: "iPad Pro 13-inch"
            sim: gatefold-ipad
            mode: real
            tests: ReaderVisibleTextUITests/testTheShelfReadsNoWords NavigationPlaceUITests/testTheOpeningCoverLetsTheControlsThrough
          - device: "iPhone Duo"
            sim: gatefold-duo
            mode: real
            tests: FineTuneTapUITests/testATapOnTheRowsNameChangesItsSwitch PositionUITests/testBookmarkInTheTopBarBookmarks
          - device: "iPad Pro 13-inch"
            sim: gatefold-ipad
            mode: plain
            tests: ReaderVisibleTextUITests/testTheShelfReadsNoWords NavigationPlaceUITests/testTheOpeningCoverLetsTheControlsThrough
          - device: "iPhone Duo"
            sim: gatefold-duo
            mode: plain
            tests: FineTuneTapUITests/testATapOnTheRowsNameChangesItsSwitch PositionUITests/testBookmarkInTheTopBarBookmarks
    steps:
      - run: |
          echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
          echo "- restore (${{ matrix.mode }}): load at job start $(sysctl -n vm.loadavg)" | tee -a "$GITHUB_STEP_SUMMARY"
          nohup sh -c 'while :; do echo "== $(date -u +%T) $(sysctl -n vm.loadavg)"; ps -Aceo pcpu=,comm= -r | head -6; sleep 15; done' > "$RUNNER_TEMP/load.log" 2>&1 &
      - uses: actions/checkout@v4
      - uses: ./.github/actions/select-xcode
        with:
          xcode: "27.2"
      - id: key
        run: |
          python3 -I scripts/ci-simulator.py key "${{ matrix.device }}" | sed "s/^key=/key=probe4-${{ github.run_id }}-/" | tee -a "$GITHUB_OUTPUT"
      - run: echo "RESTORE_START=$(date +%s)" >> "$GITHUB_ENV"
      - id: warm
        uses: actions/cache/restore@v4
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: "3"
        with:
          path: ~/warm-sim
          key: ${{ steps.key.outputs.key }}
          fail-on-cache-miss: true
      - run: |
          echo "- restore: cache restore $(( $(date +%s) - RESTORE_START )) s, $(du -sk ~/warm-sim | cut -f1) KiB; job start to here $(( $(date +%s) - JOB_START )) s" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Plain boot of the clone
        if: matrix.mode == 'plain'
        run: bash scripts/sim-cache-probe.sh plainboot
      - name: The shard's start and wait, with the warm device
        if: matrix.mode == 'real'
        timeout-minutes: 30
        env:
          CI_SIMULATOR_BUDGET: "1740"
        run: |
          t0=$(date +%s)
          BOOT_SIM_WARM_SET="$HOME/warm-sim" python3 -I scripts/ci-simulator.py start "${{ matrix.sim }}" "${{ matrix.device }}"
          python3 -I scripts/ci-simulator.py wait "${{ matrix.sim }}" "${{ matrix.device }}" 1200
          echo "- restore: start to a checked, warm device $(( $(date +%s) - t0 )) s, load $(sysctl -n vm.loadavg)" | tee -a "$GITHUB_STEP_SUMMARY"
          grep -h "warm:" "$RUNNER_TEMP"/ci-simulator/*.log | tee -a "$GITHUB_STEP_SUMMARY"
      - name: A main build of the app and its tests (run 44603453975)
        uses: actions/download-artifact@v4
        with:
          name: gatefold-tests-711bed096d298341a5cb36e49cfb78061c6ae28c-xcode-27.2-27B52
          run-id: 44603453975
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}
      - name: Two UI tests on the warm device
        timeout-minutes: 20
        env:
          TESTS: ${{ matrix.tests }}
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/dd/Build" && tar -xzf "$RUNNER_TEMP/products.tgz" -C "$RUNNER_TEMP/dd/Build"
          xctestrun=$(ls "$RUNNER_TEMP"/dd/Build/Products/*.xctestrun | head -1)
          only=(); for t in $TESTS; do only+=("-only-testing:GatefoldUITests/$t"); done
          t0=$SECONDS
          xcodebuild test-without-building -xctestrun "$xctestrun" -destination "$DESTINATION" "${only[@]}" 2>&1 \
            | grep -E "Test Case .*(started|passed|failed|skipped)|TEST (SUCCEEDED|FAILED)|error:"
          code=${PIPESTATUS[0]}
          echo "- restore: UI tests exit $code in $((SECONDS - t0)) s" | tee -a "$GITHUB_STEP_SUMMARY"
          exit $code
      - name: What made the load during the boot
        if: always()
        run: |
          pkill -f "ps -Aceo" || true
          awk '/^==/{t=$0; next} {c[$2]+=$1; n[$2]++} END{for (k in c) printf "%8.0f %s\n", c[k], k}' "$RUNNER_TEMP/load.log" | sort -rn | head -15
          grep "^==" "$RUNNER_TEMP/load.log" | head -30
