name: TestFlight

# Every green commit on main goes to Gatefold Internal on TestFlight, with no Mac at home involved.
# Only green: a commit publishes once every required check on it passed (.github/required-checks.txt,
# judged by scripts/ci-green-gate.py). This workflow starts each time App or Real unfold finishes on a
# main push and asks whether that commit is now green; the second of the two to finish publishes it.
# A red commit never publishes. A commit whose run was replaced by a newer push (gatefold#246) is
# covered by that newer commit's publish. A Markdown-only push runs no App, so it never publishes.
on:
  workflow_run:
    workflows: [App, Real unfold]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      build_number:
        description: Build number override (default App Store Connect's highest + 1)
        required: false
        type: string
      whats_new:
        description: What's New override (default the commit's subject)
        required: false
        type: string

permissions:
  contents: read

jobs:
  # Is this commit green, and still newer than the last build published? Cheap, on Linux.
  gate:
    name: Main is green here
    if: >-
      github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      state: ${{ steps.gate.outputs.state }}
      publish: ${{ steps.decide.outputs.publish }}
    steps:
      - id: sha
        env:
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: echo "sha=${RUN_SHA:-$GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.sha.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: The gate passes its selftest
        run: python3 -I scripts/ci-green-gate.py --selftest
      - name: Every required check passed on this commit
        id: gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -I scripts/ci-green-gate.py --sha "${{ steps.sha.outputs.sha }}"
      - name: Decide
        id: decide
        env:
          SHA: ${{ steps.sha.outputs.sha }}
          STATE: ${{ steps.gate.outputs.state }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$SHA" origin/main || { echo "::error::$SHA is not on main."; exit 1; }
          say() { echo "::notice::$1"; echo "$1" >> "$GITHUB_STEP_SUMMARY"; }
          case "$STATE" in
            green) ;;
            pending) say "${SHA:0:7} is not green yet (a required check is still running); its last check to finish asks again."
                     [[ "$EVENT" == workflow_dispatch ]] && exit 1
                     echo "publish=false" >> "$GITHUB_OUTPUT"; exit 0 ;;
            superseded) say "${SHA:0:7}'s checks were replaced by a newer push to main; that commit's publish covers it."
                     [[ "$EVENT" == workflow_dispatch ]] && exit 1
                     echo "publish=false" >> "$GITHUB_OUTPUT"; exit 0 ;;
            # Red: App or Real unfold already reports it; this run only says it held the build back.
            *) echo "::warning::${SHA:0:7} is red on main, so it does not go to TestFlight. Fix main; the next green commit publishes."
               echo "${SHA:0:7} is red on main: not published." >> "$GITHUB_STEP_SUMMARY"
               [[ "$EVENT" == workflow_dispatch ]] && exit 1
               echo "publish=false" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          # Each published build is tagged testflight/build-N. A tag at or after this commit means it is out already.
          done_at="$(git tag --list 'testflight/build-*' --contains "$SHA" | head -1)"
          if [[ -n "$done_at" ]]; then
            say "${SHA:0:7} is already on TestFlight ($done_at is at or after it)."
            echo "publish=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Nothing in the app changed since the last build (only Markdown or the website): nothing to send.
          last="$(git describe --tags --match 'testflight/build-*' --abbrev=0 "$SHA" 2>/dev/null || true)"
          app_files=""
          [[ -n "$last" ]] && app_files="$(git diff --name-only "$last" "$SHA" | grep -vE '(\.md$|^docs/)' || true)"
          if [[ -n "$last" && -z "$app_files" && "$EVENT" != workflow_dispatch ]]; then
            say "Only Markdown or docs/ changed since $last: nothing new for TestFlight."
            echo "publish=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
          say "${SHA:0:7} is green on main: publishing."

  # Hold switch: the repository variable TESTFLIGHT_HOLD=1 stops automatic publishes (for example while
  # fixes land that are not yet proven on a device). A manual run still publishes a green commit.
  held:
    name: Publishing is on hold
    needs: gate
    if: needs.gate.outputs.publish == 'true' && github.event_name == 'workflow_run' && vars.TESTFLIGHT_HOLD == '1'
    runs-on: ubuntu-latest
    steps:
      - run: |
          msg="TestFlight publishing is on hold (repository variable TESTFLIGHT_HOLD=1). Nothing was published. Clear the variable to resume, or run this workflow by hand to publish this commit."
          echo "::notice::$msg"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish to Gatefold Internal
    needs: gate
    if: needs.gate.outputs.publish == 'true' && (github.event_name == 'workflow_dispatch' || vars.TESTFLIGHT_HOLD != '1')
    environment: internal-testflight
    runs-on: xcode-27
    timeout-minutes: 90
    permissions:
      contents: write # the testflight/build-N tag, after the build is in the group
    # One publish at a time and never cancelled mid-upload. A newer green commit waiting behind a running
    # publish replaces an older waiting one, so main's newest green commit is always the next published.
    concurrency:
      group: gatefold-testflight-internal
      cancel-in-progress: false
    env:
      GATEFOLD_SHA: ${{ needs.gate.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      # It may have waited behind another publish; one at or after this commit may have gone out meanwhile.
      - name: Still the newest green commit to publish
        run: |
          set -euo pipefail
          git fetch --quiet --tags origin
          done_at="$(git tag --list 'testflight/build-*' --contains "$GATEFOLD_SHA" | head -1)"
          if [[ -n "$done_at" ]]; then
            echo "::notice::${GATEFOLD_SHA:0:7} went out while this run waited ($done_at). Nothing to publish."
            echo "GATEFOLD_FRESH=false" >> "$GITHUB_ENV"
          else
            echo "GATEFOLD_FRESH=true" >> "$GITHUB_ENV"
          fi

      - uses: ./.github/actions/select-xcode
        if: env.GATEFOLD_FRESH == 'true'

      - name: Install the Metal toolchain (the page curl is a Metal shader)
        if: env.GATEFOLD_FRESH == 'true'
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Install XcodeGen
        if: env.GATEFOLD_FRESH == 'true'
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen

      - name: Check out pinned apple-distribution-kit
        if: env.GATEFOLD_FRESH == 'true'
        uses: actions/checkout@v4
        with:
          repository: ourostack/apple-distribution-kit
          ref: c296021af0e7eacb424dc9c7f924c9cda8df9d64
          path: .ci/apple-distribution-kit
          persist-credentials: false

      - uses: actions/setup-node@v4
        if: env.GATEFOLD_FRESH == 'true'
        with:
          node-version: 22.17.1
          cache: npm
          cache-dependency-path: .ci/apple-distribution-kit/package-lock.json

      - name: Build pinned apple-distribution-kit
        if: env.GATEFOLD_FRESH == 'true'
        working-directory: .ci/apple-distribution-kit
        env:
          EXPECTED_DIST_SHA256: 09e0dded99208496bd96cecc6edc067188ec49bae4486b83f90b85e57db954b9
        run: |
          set -euo pipefail
          npm ci --loglevel=error
          npm run build
          actual="$(find dist -type f -print0 | sort -z | xargs -0 shasum -a 256 | shasum -a 256 | awk '{print $1}')"
          [[ "$actual" == "$EXPECTED_DIST_SHA256" ]] || { echo "apple-distribution-kit dist checksum mismatch: $actual" >&2; exit 1; }
          echo "APPLE_DISTRIBUTION_KIT_BIN=$PWD/dist/cli.js" >> "$GITHUB_ENV"

      - name: Write the App Store Connect key config
        if: env.GATEFOLD_FRESH == 'true'
        id: asc_credentials
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          ASC_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          [[ -n "$ASC_KEY_ID" && -n "$ASC_ISSUER_ID" && -n "$ASC_KEY_BASE64" ]] \
            || { echo "The internal-testflight environment is missing an APP_STORE_CONNECT_API_* secret." >&2; exit 1; }
          dir="$RUNNER_TEMP/app-store-connect"
          mkdir -p "$dir"
          python3 - "$dir/AuthKey.p8" "$dir/config.json" <<'PY'
          import base64, json, os, pathlib, sys
          key, config = sys.argv[1:3]
          pathlib.Path(key).write_bytes(base64.b64decode(os.environ["ASC_KEY_BASE64"], validate=True))
          os.chmod(key, 0o600)
          pathlib.Path(config).write_text(json.dumps({"keyId": os.environ["ASC_KEY_ID"], "issuerId": os.environ["ASC_ISSUER_ID"], "privateKeyPath": key}))
          os.chmod(config, 0o600)
          PY
          echo "APPLE_DISTRIBUTION_KIT_CONFIG=$dir/config.json" >> "$GITHUB_ENV"

      # The long-lived Apple Distribution certificate from secrets: the run creates no certificate,
      # and xcodebuild signs manually without calling Apple.
      - name: Import long-lived signing identity
        if: env.GATEFOLD_FRESH == 'true'
        id: signing_identity
        env:
          APPLE_DISTRIBUTION_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          node "$APPLE_DISTRIBUTION_KIT_BIN" signing import \
            --keychain "$RUNNER_TEMP/adk-signing/gatefold-ci.keychain-db" \
            --state "$RUNNER_TEMP/adk-signing/state.json"

      - name: Install the App Store provisioning profile
        if: env.GATEFOLD_FRESH == 'true'
        run: |
          set -euo pipefail
          node "$APPLE_DISTRIBUTION_KIT_BIN" signing profiles \
            --state "$RUNNER_TEMP/adk-signing/state.json" \
            --team-id 743GT2AJ24 \
            --bundle-id bot.ouro.gatefold \
            --xcconfig "$RUNNER_TEMP/adk-signing/signing.xcconfig" \
            --export-options "$RUNNER_TEMP/adk-signing/ExportOptions.plist" \
            --export-options-base distribution/ExportOptions.testflight.plist
          {
            echo "GATEFOLD_SIGNING_XCCONFIG=$RUNNER_TEMP/adk-signing/signing.xcconfig"
            echo "GATEFOLD_EXPORT_OPTIONS_PLIST=$RUNNER_TEMP/adk-signing/ExportOptions.plist"
          } >> "$GITHUB_ENV"

      - name: Write What's New
        if: env.GATEFOLD_FRESH == 'true'
        env:
          WHATS_NEW: ${{ inputs.whats_new }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/whats-new.txt"
          if [[ -n "${WHATS_NEW//[[:space:]]/}" ]]; then
            printf '%s\n' "$WHATS_NEW" > "$notes"
          else
            subject="$(git log -1 --format=%s "$GATEFOLD_SHA")"
            # A merge commit's subject is "Merge pull request #N from ..."; its body's first line is the PR title.
            if [[ "$subject" == "Merge pull request "* ]]; then
              subject="$(git log -1 --format=%b "$GATEFOLD_SHA" | sed -n '/[^[:space:]]/{p;q;}')"
            fi
            printf '%s\n' "$subject" > "$notes"
          fi
          echo "GATEFOLD_WHATS_NEW_FILE=$notes" >> "$GITHUB_ENV"

      - name: Archive, upload and publish to Gatefold Internal
        if: env.GATEFOLD_FRESH == 'true'
        id: publish
        env:
          GATEFOLD_BUILD_NUMBER: ${{ inputs.build_number }}
          GATEFOLD_TESTFLIGHT_TESTER: ${{ secrets.GATEFOLD_TESTFLIGHT_TESTER }}
          GATEFOLD_ARTIFACT_DIR: ${{ runner.temp }}/ci-testflight
        run: scripts/ci-publish-testflight.sh

      # Marks what went out, so the next publish knows where it starts (and a commit at or before it is never sent twice).
      - name: Tag the published commit testflight/build-N
        if: env.GATEFOLD_FRESH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD: ${{ steps.publish.outputs.build }}
        run: |
          set -euo pipefail
          [[ "$BUILD" =~ ^[0-9]+$ ]] || { echo "::error::The publish step gave no build number."; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/testflight/build-$BUILD" -f sha="$GATEFOLD_SHA" --silent
          echo "Tagged ${GATEFOLD_SHA:0:7} testflight/build-$BUILD"

      # Safety net: a normal run creates no certificate, so this logs "Nothing to revoke".
      - name: Revoke API-created development certificates (safety net)
        if: always() && steps.asc_credentials.outcome == 'success' && env.GATEFOLD_FRESH == 'true'
        continue-on-error: true
        run: node "$APPLE_DISTRIBUTION_KIT_BIN" signing revoke-api-certificates --best-effort

      - name: Delete signing keychain
        if: always() && steps.signing_identity.outcome != 'skipped' && env.GATEFOLD_FRESH == 'true'
        continue-on-error: true
        run: node "$APPLE_DISTRIBUTION_KIT_BIN" signing delete-keychain --keychain "$RUNNER_TEMP/adk-signing/gatefold-ci.keychain-db"

      - name: Summarize
        if: always() && env.GATEFOLD_FRESH == 'true'
        run: |
          summary="$RUNNER_TEMP/ci-testflight/testflight-publish-summary.json"
          if [[ -f "$summary" ]]; then
            {
              echo "## Gatefold Internal"
              jq -r '"- Build \(.version) (\(.buildNumber)) from \(.sourceSha[0:7])", "- State: \(.internalBuildState)", "- Uploaded \(.uploadedAt), processed \(.processedAt), available \(.availableAt)"' "$summary"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always() && env.GATEFOLD_FRESH == 'true'
        with:
          name: testflight-publish-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ci-testflight/*.json
            ${{ runner.temp }}/ci-testflight/*.log
            ${{ runner.temp }}/ci-testflight/*.txt
            ${{ runner.temp }}/ci-testflight/*.sha256
          if-no-files-found: warn
          retention-days: 30
