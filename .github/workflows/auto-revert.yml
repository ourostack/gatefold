name: Auto-revert red main

on:
  schedule:
    - cron: "4-59/10 * * * *"
  workflow_run:
    workflows: [App, Real unfold]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write
  checks: read

jobs:
  auto-revert:
    uses: ourostack/.github/.github/workflows/auto-revert-reusable.yml@main
    secrets:
      token: ${{ secrets.AUTO_REVERT_TOKEN }}
