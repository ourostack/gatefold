name: Rerun shards the runner stopped

# When an App run's first attempt failed only because of its runners (no app code ran, a lost runner, a job stopped
# from outside), rerun its failed jobs once on fresh runners, rather than waiting for a person (gatefold#135, #404).
# Any test failure leaves the run as it is. It reads job annotations and logs and calls the rerun API only; it checks
# out this repository's default branch, never the run's code (scripts/ci-rerun-runner.py).
on:
  workflow_run:
    workflows: [App]
    types: [completed]

permissions:
  actions: write
  checks: read
  contents: read

jobs:
  rerun:
    name: Rerun failed jobs the runner stopped (gatefold#135)
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          python3 -I scripts/ci-rerun-runner.py --selftest
          python3 -I scripts/ci-rerun-runner.py "$RUN_ID"
