name: Minutes left for a test step
description: >-
  The minutes a test step may run so that, if it hangs, the job still has time to report why and upload its logs
  before the job's own limit ends it (gatefold#126). A job-level limit cancels the whole job and skips every later
  step, uploads included; a step-level limit fails only the step. A job's limit is `boot` + its tests' budget +
  `reserve`, and the step gets that whole budget however long the boot took (gatefold#198): it ends that budget after
  it starts, or after the first `setup` minutes of the job when setup was quicker, never later than `reserve` minutes
  before the job's limit. Needs JOB_START (epoch seconds), set as the job begins.
inputs:
  limit:
    description: The job's timeout-minutes.
    required: true
  boot:
    description: >-
      Minutes the job's limit holds for setup: the simulator wait step's own timeout-minutes, so a boot that runs to
      that ceiling still leaves the tests their budget (gatefold#198).
    required: true
  setup:
    description: >-
      Minutes of setup the budget used to assume (gatefold#141). A setup quicker than this still leaves the step the
      spare minutes, as before, so no step gets less than it did.
    default: "12"
  reserve:
    description: Minutes kept for the steps after the test step (failure summary, place log, upload).
    default: "12"
  cap:
    description: The most this step may have, whatever is left.
    default: "600"
outputs:
  minutes:
    description: Whole minutes, at least 1.
    value: ${{ steps.left.outputs.minutes }}
  until:
    description: When those minutes end, in epoch seconds, for scripts/ci-within.py and any budget inside the step.
    value: ${{ steps.left.outputs.until }}
runs:
  using: composite
  steps:
    - id: left
      shell: bash
      env:
        LIMIT: ${{ inputs.limit }}
        BOOT: ${{ inputs.boot }}
        SETUP: ${{ inputs.setup }}
        RESERVE: ${{ inputs.reserve }}
        CAP: ${{ inputs.cap }}
      run: |
        set -eu
        [ -n "${JOB_START:-}" ] || { echo "::error::JOB_START is not set; the job notes it as it begins"; exit 1; }
        budget=$(( LIMIT - BOOT - RESERVE ))
        [ "$budget" -ge 1 ] || { echo "::error::A limit of $LIMIT min leaves no tests' budget after $BOOT for setup and $RESERVE for logs"; exit 1; }
        now=$(date +%s)
        from=$(( JOB_START + SETUP * 60 ))
        [ "$now" -le "$from" ] || from=$now
        end=$(( JOB_START + (LIMIT - RESERVE) * 60 ))
        until=$(( from + budget * 60 ))
        [ "$until" -le "$end" ] || until=$end
        left=$(( (until - now) / 60 ))
        [ "$left" -le "$CAP" ] || left=$CAP
        [ "$left" -ge 1 ] || left=1
        echo "$left min for this step: $budget min of tests after $(( (now - JOB_START) / 60 )) min of setup; the job's limit is $LIMIT min, $RESERVE kept for its logs"
        echo "minutes=$left" >> "$GITHUB_OUTPUT"
        echo "until=$(( now + left * 60 ))" >> "$GITHUB_OUTPUT"
