name: Minutes left for a test step
description: >-
  The minutes a test step may run so that, if it hangs, the job still has time to report why and upload its logs
  before the job's own limit ends it (gatefold#126). A job-level limit cancels the whole job and skips every later
  step, uploads included; a step-level limit fails only the step. A job's limit is `boot` + its tests' budget +
  `reserve`, and the step gets that whole budget whenever setup ends within `boot` minutes
  (gatefold#198): it ends that budget after it starts, or after the first `setup` minutes of the job when setup was
  quicker. scripts/ci-within.py stops the tests 2 min before the step's end so xcodebuild can write its results; those
  2 min come out of the reserve, not the budget (gatefold#353). A setup (the build wait, the boot and the download) that ran
  past `boot` minutes fails here, as infrastructure, rather than give the tests less than their budget. Needs JOB_START (epoch seconds), set as the job begins.
inputs:
  limit:
    description: The job's timeout-minutes.
    required: true
  boot:
    description: >-
      Minutes the job's limit holds for setup, the simulator wait step's own timeout-minutes (gatefold#198). The step
      gets its whole budget whenever setup ends within this many minutes of the job's start; past that the job fails
      here, as infrastructure (gatefold#353).
    required: true
  setup:
    description: >-
      Minutes of setup the budget used to assume (gatefold#141). A setup quicker than this still leaves the step the
      spare minutes, as before, so no step gets less than it did.
    default: "12"
  reserve:
    description: >-
      Minutes the job's limit keeps after the tests' budget: 2 for ci-within's stop, the rest for the steps after the
      test step (failure summary, place log, upload).
    default: "12"
  cap:
    description: The most this step may have, whatever is left.
    default: "600"
outputs:
  minutes:
    description: Whole minutes, at least 1, rounded up from `until`.
    value: ${{ steps.left.outputs.minutes }}
  until:
    description: >-
      When the step ends, in epoch seconds, for scripts/ci-within.py (which stops the tests 2 min before it) and any
      budget inside the step: the end of the tests' budget plus those 2 min.
    value: ${{ steps.left.outputs.until }}
runs:
  using: composite
  steps:
    - id: left
      shell: bash
      env:
        LIMIT: ${{ inputs.limit }}
        BOOT: ${{ inputs.boot }}
        SETUP: ${{ inputs.setup }}
        RESERVE: ${{ inputs.reserve }}
        CAP: ${{ inputs.cap }}
      # The sum, and its offline test, are in scripts/ci-within.py (`left`), beside the stop it must leave room for.
      run: |
        [ -n "${JOB_START:-}" ] || { echo "::error::JOB_START is not set; the job notes it as it begins"; exit 1; }
        python3 -I scripts/ci-within.py left "$JOB_START" "$LIMIT" "$BOOT" "$SETUP" "$RESERVE" "$CAP"
