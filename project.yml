name: Gatefold
options:
  bundleIdPrefix: bot.ouro
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
  developmentLanguage: en
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 743GT2AJ24
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "20"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
packages:
  Readium:
    # Our fork's main: 3.11.1 plus the spread view release fix and a cleared spread's spreadNotLoaded (#109,
    # ourostack/swift-toolkit#1 and #2). Keep
    # Packages/GatefoldCloud/Package.swift on the same revision: both are the package `swift-toolkit`.
    url: https://github.com/ourostack/swift-toolkit
    revision: b31bc56abb80d9009592fe79a580673ca6d17a56
  # Ouro UI for Apple: the shelf's empty states, the sync banner, Fine-Tune's rows and their buttons are its OuroHX;
  # the UI tests' Ouro Feel checks are its OuroFeel (Feel's reader checks shipped in 0.11.0,
  # ourostack/ouro-ui-apple#200).
  OuroUIApple:
    url: https://github.com/ourostack/ouro-ui-apple
    minorVersion: 1.9.0
  GatefoldCore:
    path: Packages/GatefoldCore
  GatefoldCloud:
    path: Packages/GatefoldCloud
targets:
  Gatefold:
    type: application
    platform: iOS
    sources:
      - path: Gatefold
        excludes:
          - "**/.DS_Store"
      # The App Intents and buttons for the actions in actions/gatefold.actions.mts (scripts/ouro-actions.sh generate).
      - path: actions/generated/OuroActions.swift
    resources: []
    dependencies:
      - package: GatefoldCloud
        product: GatefoldCloud
      - package: GatefoldCloud
        product: GatefoldCloudReadium
      - package: Readium
        product: ReadiumShared
      - package: Readium
        product: ReadiumStreamer
      - package: Readium
        product: ReadiumNavigator
      - package: GatefoldCore
      - package: OuroUIApple
        product: OuroHX
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: bot.ouro.gatefold
        PRODUCT_NAME: Gatefold
        INFOPLIST_FILE: Gatefold/Support/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        MTL_ENABLE_DEBUG_INFO: NO
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
  GatefoldTests:
    type: bundle.unit-test
    platform: iOS
    sources: [GatefoldTests]
    dependencies:
      - target: Gatefold
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: bot.ouro.gatefold.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Gatefold.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Gatefold"
        BUNDLE_LOADER: "$(TEST_HOST)"
  GatefoldUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [GatefoldUITests]
    dependencies:
      - target: Gatefold
      # Pure judgments a UI test shares with the unit tests (`ReopenMatch`).
      - package: GatefoldCore
      # Ouro Feel's checks (FeelReaderUITests), and the hinge that opens the Duo for them (`OuroDuoHinge`).
      - package: OuroUIApple
        product: OuroFeel
      - package: OuroUIApple
        product: OuroFeelCore
      - package: OuroUIApple
        product: OuroHXTesting
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: bot.ouro.gatefold.uitests
        GENERATE_INFOPLIST_FILE: YES
        # Installs `LogMirrorOff` before any test (GatefoldUITests/LogMirrorOff.swift, gatefold#28).
        INFOPLIST_KEY_NSPrincipalClass: GatefoldUITestsPrincipal
        TEST_TARGET_NAME: Gatefold
  # The App Store screenshots' scenes (screenshots/spec.json). Its own scheme, so App's build and shards never see it.
  GatefoldListingShots:
    type: bundle.ui-testing
    platform: iOS
    sources: [GatefoldListingShots]
    dependencies:
      - target: Gatefold
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: bot.ouro.gatefold.listingshots
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Gatefold
schemes:
  Gatefold:
    build:
      targets:
        Gatefold: all
        GatefoldTests: [test]
        GatefoldUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - name: GatefoldTests
        - name: GatefoldUITests
    archive:
      config: Release
  # Release only (.github/workflows/screenshots.yml).
  GatefoldListingShots:
    build:
      targets:
        Gatefold: all
        GatefoldListingShots: [test]
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - name: GatefoldListingShots
