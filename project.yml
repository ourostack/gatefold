name: Gatefold
options:
  bundleIdPrefix: bot.ouro
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
  developmentLanguage: en
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 743GT2AJ24
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "20"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
packages:
  Readium:
    # Our fork's main: 3.11.1 plus the spread view release fix and a cleared spread's spreadNotLoaded (#109,
    # ourostack/swift-toolkit#1 and #2). Keep
    # Packages/GatefoldCloud/Package.swift on the same revision: both are the package `swift-toolkit`.
    url: https://github.com/ourostack/swift-toolkit
    revision: a0eb21330d0f8c37476859922bd967073e7b73f4
  GatefoldCore:
    path: Packages/GatefoldCore
  # Ouro Feel, for the UI tests only (FeelUITests): the app never links it, nor its recorder. Exact, so a check never changes under us.
  OuroUIApple:
    url: https://github.com/ourostack/ouro-ui-apple
    exactVersion: 0.4.1
  GatefoldCloud:
    path: Packages/GatefoldCloud
targets:
  Gatefold:
    type: application
    platform: iOS
    sources:
      - path: Gatefold
        excludes:
          - "**/.DS_Store"
    resources: []
    dependencies:
      - package: GatefoldCloud
        product: GatefoldCloud
      - package: GatefoldCloud
        product: GatefoldCloudReadium
      - package: Readium
        product: ReadiumShared
      - package: Readium
        product: ReadiumStreamer
      - package: Readium
        product: ReadiumNavigator
      - package: GatefoldCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: bot.ouro.gatefold
        PRODUCT_NAME: Gatefold
        INFOPLIST_FILE: Gatefold/Support/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        MTL_ENABLE_DEBUG_INFO: NO
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
  GatefoldTests:
    type: bundle.unit-test
    platform: iOS
    sources: [GatefoldTests]
    dependencies:
      - target: Gatefold
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: bot.ouro.gatefold.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Gatefold.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Gatefold"
        BUNDLE_LOADER: "$(TEST_HOST)"
  GatefoldUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [GatefoldUITests]
    dependencies:
      - target: Gatefold
      # Pure judgments a UI test shares with the unit tests (`ReopenMatch`).
      - package: GatefoldCore
      - package: OuroUIApple
        product: OuroFeel
      - package: OuroUIApple
        product: OuroFeelCore
      # Ouro Feel's recorder, injected into the app at launch from this bundle (simulator only), so Release never
      # links it.
      - package: OuroUIApple
        product: OuroFeelRecorderInjectable
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: bot.ouro.gatefold.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Gatefold
schemes:
  Gatefold:
    build:
      targets:
        Gatefold: all
        GatefoldTests: [test]
        GatefoldUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - name: GatefoldTests
        - name: GatefoldUITests
    archive:
      config: Release
